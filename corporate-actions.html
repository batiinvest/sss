<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSS · 무상증자 관리</title>
  <link rel="stylesheet" href="css/style.css?v=20260921.1">
  <script>if(window!==window.parent){document.documentElement.classList.add('in-iframe');}</script>
</head>
<body>
<div class="layout layout-page"><main class="main">
  <div class="topbar"><div><h1 class="page-title">무상증자 관리</h1>
    <p class="updated">종목별 신주 배정과 입고 내역을 기록합니다.</p></div></div>
  <p id="caStatus" role="status">연결 확인 중…</p>
  <section class="card" id="caFormCard" hidden>
    <div class="card-head"><h2 class="card-title">무상증자 등록</h2>
      <button class="btn" type="button" id="caRfPreset">RF머트리얼즈 공시 불러오기</button></div>
    <form id="caForm" class="form-section">
      <div class="form-row">
        <div class="form-group"><label for="caCode">종목코드</label><input id="caCode" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required placeholder="327260"></div>
        <div class="form-group"><label for="caName">종목명</label><input id="caName" required maxlength="80" placeholder="RF머트리얼즈"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label for="caExisting">기존 주식 (주)</label><input id="caExisting" type="number" value="1" min="1" step="1" required></div>
        <div class="form-group"><label for="caNew">추가 배정 신주 (주)</label><input id="caNew" type="number" value="1" min="1" step="1" required></div>
      </div>
      <p id="caRatio" class="muted-copy">기존 1주당 신주 1주 → 총 2주</p>
      <div class="form-row">
        <div class="form-group"><label for="caEx">권리락일</label><input id="caEx" type="date" required></div>
        <div class="form-group"><label for="caRecord">신주 배정기준일</label><input id="caRecord" type="date" required></div>
        <div class="form-group"><label for="caExpected">입고 예정일</label><input id="caExpected" type="date"></div>
      </div>
      <div class="form-group"><label for="caSource">공시 링크</label><input id="caSource" type="url" required placeholder="https://kind.krx.co.kr/…"></div>
      <p class="muted-copy">권리락 전 보유분에만 적용됩니다. 신주는 실제 입고를 확인한 뒤 매도 가능 수량에 포함됩니다.</p>
      <button class="btn btn-primary" id="caPreviewButton" type="submit">변경 내역 미리보기</button>
    </form>
  </section>
  <section id="caPreview" class="card" hidden aria-labelledby="caPreviewTitle" style="margin-top:1rem;">
    <div class="card-head"><h2 id="caPreviewTitle" class="card-title">적용 전 확인</h2></div>
    <div class="form-section"><div id="caPreviewBody"></div>
      <button type="button" class="btn btn-primary" id="caApply">무상증자 적용</button></div>
  </section>
  <section class="card" style="margin-top:1rem;">
    <div class="card-head"><h2 class="card-title">반영 이력</h2></div>
    <div class="form-section" id="caHistory">불러오는 중…</div>
  </section>
  <p id="caError" role="alert" style="color:var(--red);"></p>
</main></div>
<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js?v=20260921.1"></script>
<script src="js/utils/corporate-actions.js?v=20260921.1"></script>
<script src="js/corporate-actions-service.js?v=20260921.1"></script>
<script src="js/corporate-actions-page.js?v=20260921.1"></script>
</body>
</html>
