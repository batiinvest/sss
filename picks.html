<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSS · 투자종목</title>
  <link rel="stylesheet" href="css/style.css?v=20260711.2">
  <script>if(window!==window.parent){document.documentElement.classList.add("in-iframe");}</script>

</head>
<body>

<div class="layout layout-page"><main class="main">
    <div id="db-banner" class="db-banner pending">DB 연결 확인 중...</div>

    <div class="topbar">
      <div>
        <div class="page-title">투자종목</div>
        <div class="updated">투자 아이디어, 보유현황과 성과를 확인하세요.</div>
      </div>
      <button class="btn btn-primary" onclick="openPickForm()">투자종목 등록</button>
    </div>

    <div class="mobile-only mobile-page-tools">
      <label class="mobile-page-search" for="investmentSearch"><span aria-hidden="true">⌕</span><input type="search" id="investmentSearch" placeholder="종목명 또는 코드 검색" autocomplete="off"></label>
      <button type="button" class="btn mobile-filter-toggle" onclick="toggleInvestmentFilters()" aria-controls="investmentMobileFilters" aria-expanded="false">필터</button>
    </div>
    <div id="investmentMobileFilters" class="mobile-only mobile-filter-panel" hidden>
      <label>담당자<select id="mobileInvestmentMember" onchange="applyMobileInvestmentFilters()"><option value="">전체 담당자</option></select></label>
      <label>상태<select id="mobileInvestmentStatus" onchange="applyMobileInvestmentFilters()"><option value="">전체 상태</option><option value="waiting">매수 대기</option><option value="investing">투자 진행</option><option value="sold">매도 완료</option></select></label>
      <button type="button" class="btn" onclick="resetInvestmentFilters()">필터 초기화</button>
    </div>

    <!-- 월별 탭 + 테이블 -->
    <div class="card mb-card">
      <div class="card-head">
        <div class="card-title">이번 달 투자종목</div>
        <div class="tab-row" id="monthTabs"></div>
      </div>
      <div id="mobileMonthInvestments" class="mobile-stock-list" aria-live="polite"><div class="mobile-list-skeleton"></div></div>
      <div class="table-wrap desktop-table-on-mobile">
        <table>
          <caption class="sr-only">이번 달 투자종목의 담당자, 매수가, 수익률과 상태</caption>
          <thead><tr>
            <th>추천자</th><th>종목</th><th class="col-hide-mobile">시장</th>
            <th class="col-hide-mobile">매수가</th><th class="col-hide-mobile">매도가</th><th>확정 수익률</th>
            <th class="col-hide-mobile">목표가</th><th class="col-hide-mobile">시총 상승여력</th><th>상태</th>
          </tr></thead>
          <tbody id="monthPicksTbody">
            <tr><td colspan="9" class="empty-cell">불러오는 중...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 매수 사유 카드 -->
    <div class="card desktop-summary-on-mobile">
      <div class="card-head"><div class="card-title">매수 사유</div></div>
      <div id="reasonCards" class="grid-2" style="grid-template-columns:repeat(2,minmax(0,1fr));"></div>
    </div>

    <!-- 전체 히스토리 -->
    <div class="card" style="margin-top:1.25rem;">
      <div class="card-head">
        <div class="card-title">전체 히스토리</div>
        <div class="desktop-filter-controls" style="display:flex;gap:6px;align-items:center;">
          <select id="filterMember" aria-label="담당자 필터" onchange="applyFilter()" style="font-size:12px;padding:4px 8px;width:auto;">
            <option value="">전체 참여자</option>
          </select>
          <select id="filterStatus" aria-label="투자 상태 필터" onchange="applyFilter()" style="font-size:12px;padding:4px 8px;width:auto;">
            <option value="">전체 상태</option>
            <option value="hold">보유중</option>
            <option value="sold">매도완료</option>
          </select>
        </div>
      </div>
      <div id="mobileInvestmentHistory" class="mobile-stock-list"></div>
      <div class="table-wrap desktop-table-on-mobile">
        <table style="table-layout:fixed;min-width:720px;">
          <caption class="sr-only">전체 투자종목 월별 이력</caption>
          <thead><tr>
            <th style="width:64px;">월</th>
            <th style="width:70px;">추천자</th>
            <th style="width:110px;">종목</th>
            <th style="width:56px;">시장</th>
            <th style="width:90px;">매수가</th>
            <th style="width:90px;">매도가</th>
            <th style="width:80px;">수익률</th>
            <th style="width:70px;">상태</th>
            <th class="col-hide-mobile">매수 사유</th>
          </tr></thead>
          <tbody id="historyTbody">
            <tr><td colspan="9" class="empty-cell">불러오는 중...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

</main>
</div>
<div id="toast" class="toast"></div>

<div id="investmentDetailModal" class="detail-overlay" role="dialog" aria-modal="true" aria-labelledby="investmentDetailTitle" onclick="if(event.target===this) closeInvestmentDetail()">
  <section class="detail-panel">
    <div class="detail-head">
      <div><h2 id="investmentDetailTitle" class="detail-title">투자종목</h2><p id="investmentDetailSubtitle" class="detail-subtitle"></p></div>
      <button type="button" class="detail-close" onclick="closeInvestmentDetail()" aria-label="상세 닫기">×</button>
    </div>
    <div id="investmentDetailBody"></div>
    <div class="detail-actions">
      <button type="button" class="btn" id="investmentShareBtn">공유 링크 복사</button>
      <button type="button" class="btn" id="investmentBuyBtn">매수 등록</button>
      <button type="button" class="btn btn-primary" id="investmentSellBtn">매도 등록</button>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js?v=20260711.2"></script>
<script src="js/db.js?v=20260711.2"></script>
<script src="js/modal-pick.js?v=20260711.2"></script>
<script>
let allPicks = [];
let members  = [];
let selMonth = currentMonth();
let investmentPriceMap = {};
let investmentSearchTerm = '';
let investmentDetailId = null;
let investmentDetailReturnFocus = null;

function recentMonthsFrom(month, count = 8) {
  const [year, mon] = String(month || currentMonth()).split('-').map(Number);
  if (!year || !mon) return [currentMonth()];

  const months = [];
  for (let i = 0; i < count; i++) {
    const d = new Date(year, mon - 1 - i, 1);
    months.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
  }
  return months;
}

async function reloadPicksData() {
  allPicks = await fetchAllPicks();
  const codes = [...new Set(allPicks.map(p => p.stock_code).filter(Boolean))];
  investmentPriceMap = await fetchCurrentPrices(codes);
}

async function init() {
  const session = await requireAuth();
  if (!session) return;
  checkDBConnection();

  // 조회 화면은 DB를 변경하지 않는다. 이월 항목은 화면에서만 합성한다.
  [members, allPicks] = await Promise.all([
    fetchMembers(),
    fetchAllPicks(),
  ]);
  investmentPriceMap = await fetchCurrentPrices([...new Set(allPicks.map(p => p.stock_code).filter(Boolean))]);

  const flt = document.getElementById('filterMember');
  members.forEach(m => {
    flt.innerHTML += `<option value="${escapeHtml(m.id)}">${escapeHtml(m.name)}</option>`;
  });
  document.getElementById('mobileInvestmentMember').innerHTML = '<option value="">전체 담당자</option>' + members.map(member =>
    `<option value="${escapeHtml(member.id)}">${escapeHtml(member.name)}</option>`
  ).join('');

  const params = new URLSearchParams(location.search);
  const search = params.get('search');
  if (search) {
    investmentSearchTerm = search.trim().toLowerCase();
    document.getElementById('investmentSearch').value = search;
  }

  buildMonthTabs();
  renderMonthPicks(selMonth);
  renderHistory(allPicks.filter(matchesInvestmentFilters));

  // 탑픽 제출 후 목록 자동 갱신
  ModalPick.mount();
  ModalPick._onSubmit = async () => { await reloadPicksData(); buildMonthTabs(); renderMonthPicks(selMonth); applyFilter(); };

  const detailId = params.get('id');
  if (detailId) openInvestmentDetail(detailId);

  if (params.get('action') === 'new') {
    const presentationId = params.get('presentation');
    if (presentationId) await openPickFromPresentation(presentationId);
    else openPickForm();
  }
}

// ── 월 탭
function buildMonthTabs() {
  const months = [...new Set([
    ...recentMonthsFrom(currentMonth(), 8),
    ...allPicks.map(p => p.month),
    selMonth,
  ].filter(Boolean))].sort().reverse();
  const visibleMonths = months.slice(0, 8);
  if (!visibleMonths.includes(selMonth)) {
    visibleMonths.pop();
    visibleMonths.unshift(selMonth);
  }
  document.getElementById('monthTabs').innerHTML = visibleMonths.map(m => {
    const label = m.replace('-','년 ') + '월';
    return `<div class="tab ${m===selMonth?'active':''}" onclick="switchMonth('${m}',this)">${label}</div>`;
  }).join('');
}

async function switchMonth(month, el) {
  selMonth = month;
  document.querySelectorAll('#monthTabs .tab').forEach(t => t.classList.remove('active'));
  el?.classList.add('active');
  document.getElementById('monthPicksTbody').innerHTML = '<tr><td colspan="9" class="empty-cell">불러오는 중...</td></tr>';

  await reloadPicksData();
  buildMonthTabs();
  renderMonthPicks(month);
  applyFilter();
}

function investmentState(pick) {
  if (pick.status === 'sold') return { key: 'sold', label: '매도 완료', cls: 'b-sold' };
  if (Number(pick.buy_quantity) > 0 || Number(pick.buy_price) > 0) return { key: 'investing', label: '투자 진행', cls: 'b-buy' };
  return { key: 'waiting', label: '매수 대기', cls: 'b-warn' };
}

function investmentCurrentPrice(pick) {
  return investmentPriceMap[pick.stock_code]?.price || null;
}

function investmentReturn(pick) {
  if (pick.status === 'sold' && pick.realized_return != null) return Number(pick.realized_return);
  const current = investmentCurrentPrice(pick);
  const buy = Number(pick.buy_price || pick.price_at || 0);
  return current && buy ? (current - buy) / buy * 100 : null;
}

function renderInvestmentCards(picks, containerId, emptyMessage) {
  const container = document.getElementById(containerId);
  if (!container) return;
  if (!picks.length) {
    container.innerHTML = `<div class="mobile-empty-state"><strong>${escapeHtml(emptyMessage)}</strong><span>필터를 초기화하거나 투자종목을 등록해 보세요.</span><button type="button" class="btn btn-primary" onclick="openPickForm()">투자종목 등록</button></div>`;
    return;
  }
  container.innerHTML = picks.map(pick => {
    const state = investmentState(pick);
    const current = investmentCurrentPrice(pick);
    const buy = Number(pick.buy_price || pick.price_at || 0) || null;
    const rate = investmentReturn(pick);
    const quantity = Number(pick.buy_quantity || 0);
    const profit = buy && current && quantity ? (current - buy) * quantity : null;
    const id = pick.pick_id || pick.id;
    return `<button type="button" class="mobile-stock-card" onclick="openInvestmentDetail('${escapeHtml(id)}')">
      <span class="mobile-stock-card-head"><strong>${escapeHtml(pick.stock_name || '종목 미입력')}</strong><span class="badge ${state.cls}">${state.label}</span></span>
      <span class="mobile-stock-card-meta">${escapeHtml(pick.member_name || '담당자 미정')} · ${escapeHtml(pick.stock_code || '')}</span>
      <span class="mobile-stock-card-metrics">
        <span>평균 매수가<strong>${buy ? buy.toLocaleString('ko-KR') + '원' : '—'}</strong></span>
        <span>현재가<strong>${current ? Number(current).toLocaleString('ko-KR') + '원' : '—'}</strong></span>
        <span>수익률<strong class="${rate === null ? '' : rate >= 0 ? 'up' : 'dn'}">${rate === null ? '—' : pct(rate)}</strong></span>
      </span>
      <span class="mobile-stock-card-foot">${profit === null ? '평가손익 계산 전' : `평가손익 ${profit >= 0 ? '+' : ''}${Number(profit).toLocaleString('ko-KR')}원`} · ${escapeHtml((pick.month || '').replace('-', '년 ') + (pick.month ? '월' : ''))}</span>
    </button>`;
  }).join('');
}

function renderMonthPicks(month) {
  const activeMemberIds = new Set((members || []).map(m => m.id));
  const currentPicks = allPicks.filter(p => p.month === month);
  const picks = buildCarryForwardPicks(month, currentPicks, allPicks, { activeMemberIds })
    .filter(matchesInvestmentFilters);
  const tbody = document.getElementById('monthPicksTbody');
  if (!picks.length) {
    tbody.innerHTML = `<tr><td colspan="9" class="empty-cell">${month} 탑픽 없음</td></tr>`;
    document.getElementById('reasonCards').innerHTML = '';
    renderInvestmentCards([], 'mobileMonthInvestments', `${month.replace('-', '년 ')}월 투자종목이 없습니다.`);
    return;
  }
  renderInvestmentCards(picks, 'mobileMonthInvestments', '이번 달 투자종목이 없습니다.');
  tbody.innerHTML = picks.map((p, i) => {
    const r = p.realized_return;
    const upside = p.target_cap && p.current_cap
      ? (((p.target_cap - p.current_cap) / p.current_cap) * 100).toFixed(1) : null;
    const badgeHtml = p.status==='sold'
      ? statusBadge('sold') : statusBadge('hold');
    return `<tr>
      <td><div class="flex"><div class="avatar ${avCls[i%6]}">${escapeHtml((p.member_name||'').slice(0,2))}</div>${escapeHtml(p.member_name)}</div></td>
      <td style="font-weight:500;">${escapeHtml(p.stock_name)}<br><span style="font-size:11px;color:var(--muted);">${escapeHtml(p.stock_code||'')}${p.carried_from ? ` · ${escapeHtml(p.carried_from.replace('-','년 '))}월 이월` : ''}</span></td>
      <td><span class="badge b-hold">${p.market||'KOSPI'}</span></td>
      <td>${won(p.buy_price)}</td>
      <td>${won(p.sell_price)}</td>
      <td class="${rCls(r)}">${pct(r)}</td>
      <td style="color:var(--green);">${won(p.target_price)}</td>
      <td>${upside ? `<span style="color:var(--green);">+${upside}%</span>` : '-'}</td>
      <td>${badgeHtml}</td>
    </tr>`;
  }).join('');

  document.getElementById('reasonCards').innerHTML = picks.map(p => `
    <div style="background:var(--bg);border-radius:var(--r-md);padding:12px 14px;">
      <div style="font-size:13px;font-weight:500;margin-bottom:4px;">${escapeHtml(p.member_name)} · ${escapeHtml(p.stock_name)}
        ${p.stock_code ? `<span style="font-size:11px;color:var(--muted);font-weight:400;">(${escapeHtml(p.stock_code)})</span>` : ''}
      </div>
      <div style="font-size:12px;color:var(--muted);line-height:1.7;">${escapeHtml(p.reason||'사유 미입력')}</div>
    </div>`).join('');
}

function renderHistory(filtered) {
  const picks = filtered || allPicks;
  const tbody = document.getElementById('historyTbody');
  if (!picks.length) {
    tbody.innerHTML = '<tr><td colspan="9" class="empty-cell">데이터 없음</td></tr>';
    renderInvestmentCards([], 'mobileInvestmentHistory', '조건에 맞는 투자종목이 없습니다.');
    return;
  }
  renderInvestmentCards(picks, 'mobileInvestmentHistory', '투자종목 이력이 없습니다.');
  tbody.innerHTML = picks.map((p, i) => {
    const r = p.realized_return;
    const badgeHtml = p.status==='sold'
      ? statusBadge('sold') : statusBadge('hold');
    return `<tr>
      <td class="muted">${(p.month||'').replace('-','년 ')}월</td>
      <td><div class="flex"><div class="avatar ${avCls[i%6]}">${escapeHtml((p.member_name||'').slice(0,2))}</div></div></td>
      <td style="font-weight:500;">${escapeHtml(p.stock_name)}</td>
      <td class="muted">${escapeHtml(p.market||'')}</td>
      <td>${won(p.buy_price)}</td>
      <td>${won(p.sell_price)}</td>
      <td class="${rCls(r)}">${pct(r)}</td>
      <td>${badgeHtml}</td>
      <td style="font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px;">${escapeHtml(p.reason||'-')}</td>
    </tr>`;
  }).join('');
}

function applyFilter() {
  renderMonthPicks(selMonth);
  renderHistory(allPicks.filter(matchesInvestmentFilters));
}

function matchesInvestmentFilters(p) {
  const memberId = document.getElementById('filterMember').value;
  const desktopStatus = document.getElementById('filterStatus').value;
  const mobileStatus = document.getElementById('mobileInvestmentStatus').value;
  const status = mobileStatus || desktopStatus;
  const state = investmentState(p).key;
  const haystack = [p.stock_name, p.stock_code, p.member_name, p.reason].filter(Boolean).join(' ').toLowerCase();
  const statusMatch = !status ||
    (status === 'hold' && p.status !== 'sold') ||
    (status === 'sold' && p.status === 'sold') ||
    state === status;
  return (!memberId || p.member_id === memberId) &&
    statusMatch &&
    (!investmentSearchTerm || haystack.includes(investmentSearchTerm));
}

// picks.html: ModalPick(modal-pick.js)으로 위임
function openPickForm(options = {}) {
  ModalPick.open({ month: selMonth, ...options });
}

async function openPickFromPresentation(presentationId) {
  const { data: presentation, error } = await sb.from('presentations')
    .select('*').eq('id', presentationId).maybeSingle();
  if (error || !presentation) {
    toast('연결할 발표종목을 찾지 못했습니다.');
    openPickForm();
    return;
  }
  const stockName = String(presentation.topic || '').split('>').pop().trim();
  let stock = null;
  if (presentation.stock_code) {
    const { data } = await sb.from('stock_prices')
      .select('stock_code,stock_name,market,price,market_cap')
      .eq('stock_code', presentation.stock_code).maybeSingle();
    stock = data || null;
  }
  if (!stock && stockName.length >= 2) {
    const matches = await searchStockPrices(stockName, 5);
    stock = matches.find(item => item.stock_name === stockName) || matches[0] || null;
  }
  openPickForm({
    prefill: {
      stock_name: stock?.stock_name || stockName,
      stock_code: stock?.stock_code || presentation.stock_code || '',
      market: stock?.market || 'KOSPI',
      price: stock?.price || null,
      market_cap: stock?.market_cap || null,
      target_cap: presentation.target_cap || null,
      reason: presentation.reason || '',
      source_presentation_id: presentation.id,
    }
  });
}

function toggleInvestmentFilters() {
  const panel = document.getElementById('investmentMobileFilters');
  const button = document.querySelector('.mobile-filter-toggle');
  const willOpen = panel.hidden;
  panel.hidden = !willOpen;
  button.setAttribute('aria-expanded', String(willOpen));
}

function applyMobileInvestmentFilters() {
  document.getElementById('filterMember').value = document.getElementById('mobileInvestmentMember').value;
  document.getElementById('filterStatus').value = document.getElementById('mobileInvestmentStatus').value === 'sold' ? 'sold' : '';
  applyFilter();
}

function resetInvestmentFilters() {
  investmentSearchTerm = '';
  document.getElementById('investmentSearch').value = '';
  document.getElementById('mobileInvestmentMember').value = '';
  document.getElementById('mobileInvestmentStatus').value = '';
  document.getElementById('filterMember').value = '';
  document.getElementById('filterStatus').value = '';
  applyFilter();
}

async function openInvestmentDetail(id) {
  const pick = allPicks.find(item => String(item.pick_id || item.id) === String(id));
  if (!pick) { toast('투자종목을 찾을 수 없습니다.'); return; }
  investmentDetailId = id;
  investmentDetailReturnFocus = document.activeElement;
  const modal = document.getElementById('investmentDetailModal');
  document.getElementById('investmentDetailTitle').textContent = pick.stock_name || '투자종목';
  document.getElementById('investmentDetailSubtitle').textContent = [pick.stock_code, pick.member_name, pick.month].filter(Boolean).join(' · ');
  modal.classList.add('open');
  document.body.style.overflow = 'hidden';
  modal.querySelector('.detail-close').focus();

  const current = investmentCurrentPrice(pick);
  const buy = Number(pick.buy_price || pick.price_at || 0) || null;
  const quantity = Number(pick.buy_quantity || 0);
  const rate = investmentReturn(pick);
  const profit = buy && current && quantity ? (current - buy) * quantity : null;
  const state = investmentState(pick);
  const stateHelp = state.key === 'waiting'
    ? '투자 아이디어와 목표가를 확인한 뒤 매수 등록을 진행하세요.'
    : state.key === 'investing'
      ? '현재 보유 중입니다. 추가 매수나 일부 매도를 기록할 수 있습니다.'
      : '매도가 완료된 기록입니다. 성과와 매매내역을 확인하세요.';
  const { data: trades } = await sb.from('trades')
    .select('id,trade_type,price,quantity,note,traded_at')
    .eq('pick_id', pick.pick_id || pick.id)
    .order('traded_at', { ascending: false })
    .limit(8);
  if (String(investmentDetailId) !== String(id)) return;

  const tradeHtml = (trades || []).length
    ? `<div class="detail-trade-list">${trades.map(trade => `<div><span>${trade.trade_type === 'buy' ? '매수' : '매도'} · ${escapeHtml(fmtDateTime(trade.traded_at))}</span><strong>${Number(trade.price).toLocaleString('ko-KR')}원 · ${Number(trade.quantity).toLocaleString('ko-KR')}주</strong></div>`).join('')}</div>`
    : '<p class="muted-copy">아직 등록된 매매내역이 없습니다.</p>';
  document.getElementById('investmentDetailBody').innerHTML = `
    <div class="detail-hero">
      <div><span>현재가</span><strong>${current ? Number(current).toLocaleString('ko-KR') + '원' : '—'}</strong></div>
      <div><span>수익률</span><strong class="${rate === null ? '' : rate >= 0 ? 'up' : 'dn'}">${rate === null ? '—' : pct(rate)}</strong></div>
      <div><span>평가손익</span><strong class="${profit === null ? '' : profit >= 0 ? 'up' : 'dn'}">${profit === null ? '—' : (profit >= 0 ? '+' : '') + Number(profit).toLocaleString('ko-KR') + '원'}</strong></div>
      <div><span>평균 매수가</span><strong>${buy ? buy.toLocaleString('ko-KR') + '원' : '—'}</strong></div>
      <div><span>보유수량</span><strong>${quantity ? quantity.toLocaleString('ko-KR') + '주' : '0주'}</strong></div>
      <div><span>상태</span><strong>${state.label}</strong></div>
    </div>
    <section class="detail-section"><h3>목표주가</h3><p>${pick.target_price ? Number(pick.target_price).toLocaleString('ko-KR') + '원' : '아직 목표주가가 등록되지 않았습니다.'}</p></section>
    <section class="detail-section"><h3>현재 상태와 다음 단계</h3><p>${stateHelp}</p></section>
    <section class="detail-section"><h3>핵심 투자 의견</h3><p class="${pick.reason ? '' : 'muted-copy'}">${escapeHtml(pick.reason || '아직 등록된 투자 의견이 없습니다.')}</p></section>
    <section class="detail-section"><h3>매매내역</h3>${tradeHtml}</section>`;

  document.getElementById('investmentShareBtn').onclick = () => copyShareLink(`picks?id=${encodeURIComponent(pick.pick_id || pick.id)}`);
  document.getElementById('investmentBuyBtn').onclick = () => navigateToAppRoute(`trade?type=buy&pick=${encodeURIComponent(pick.pick_id || pick.id)}`);
  const sellButton = document.getElementById('investmentSellBtn');
  sellButton.disabled = quantity <= 0 || pick.status === 'sold';
  sellButton.textContent = sellButton.disabled ? '보유수량 없음' : '매도 등록';
  sellButton.onclick = () => navigateToAppRoute(`trade?type=sell&pick=${encodeURIComponent(pick.pick_id || pick.id)}`);
}

function closeInvestmentDetail() {
  investmentDetailId = null;
  document.getElementById('investmentDetailModal').classList.remove('open');
  document.body.style.overflow = '';
  if (window.parent !== window && typeof window.parent.replaceRouteState === 'function') {
    const params = new URLSearchParams(location.search);
    params.delete('id'); params.delete('v');
    window.parent.replaceRouteState('picks' + (params.toString() ? '?' + params.toString() : ''));
  }
  investmentDetailReturnFocus?.focus?.();
}

document.getElementById('investmentSearch').addEventListener('input', event => {
  investmentSearchTerm = event.target.value.trim().toLowerCase();
  applyFilter();
});
document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && document.getElementById('investmentDetailModal').classList.contains('open')) closeInvestmentDetail();
});

init();
</script>
</body>
</html>
