<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSS · 스터디 회비</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23185fa5'/><text y='75' font-size='70' font-family='sans-serif' font-weight='bold' fill='white' x='50' text-anchor='middle'>S</text></svg>">
  <link rel="stylesheet" href="css/style.css?v=20260722">
  <script>if(window!==window.parent){document.documentElement.classList.add("in-iframe");}</script>

</head>
<body>
<div class="layout layout-page">
<main class="main">
  <div id="db-banner" class="db-banner pending">DB 연결 확인 중...</div>

  <div class="topbar">
    <div>
      <div class="page-title">스터디 회비</div>
      <div class="updated" id="updatedAt">활성 회원 월 회비 자동 반영 · 스터디룸 고정비 자동 반복</div>
    </div>
    <div class="btn-row" id="adminBtns" style="display:none;">
      <button class="btn" onclick="openFeeModal()">+ 추가 회비</button>
      <button class="btn" onclick="openExpenseModal()">+ 지출 등록</button>
    </div>
  </div>

  <!-- 잔액 카드 -->
  <div class="balance-card mb-card">
    <div class="label">현재 잔액</div>
    <div class="value" id="totalBalance">계산 중...</div>
    <div class="balance-sub">
      <div class="balance-sub-item">
        <div class="sub-label">누적 회비</div>
        <div class="sub-value" id="totalFees">—</div>
      </div>
      <div class="balance-sub-item">
        <div class="sub-label">총 지출액</div>
        <div class="sub-value" id="totalExpenses">—</div>
      </div>
      <div class="balance-sub-item">
        <div class="sub-label">선택 월 회비</div>
        <div class="sub-value" id="thisMonthPaid">—</div>
      </div>
    </div>
  </div>

  <div class="grid-2">

    <!-- 월별 회비 현황 -->
    <div class="card">
      <div class="card-head">
        <div class="card-title">월 회비</div>
        <div class="month-nav">
          <button onclick="changeMonth(-1)">‹</button>
          <span id="currentMonthLabel" style="font-size:13px;font-weight:500;min-width:70px;text-align:center;"></span>
          <button onclick="changeMonth(1)">›</button>
        </div>
      </div>
      <div style="padding:0 1rem 1rem;">
        <div id="feeProgress" style="margin-bottom:12px;"></div>
        <div id="memberFeeList"></div>
      </div>
    </div>

    <!-- 지출 내역 -->
    <div class="card">
      <div class="card-head">
        <div class="card-title">지출 내역</div>
        <select id="expenseFilter" onchange="renderExpenses()" style="font-size:12px;padding:4px 8px;width:auto;">
          <option value="">전체</option>
          <option value="room">스터디룸</option>
          <option value="drink">음료</option>
          <option value="dinner">회식</option>
          <option value="other">기타</option>
        </select>
      </div>
      <div style="padding:0 1rem 1rem;">
        <div id="expenseList"></div>
      </div>
    </div>

  </div>

  <!-- 월별 요약 -->
  <div class="card" style="margin-top:1.25rem;">
    <div class="card-head"><div class="card-title">월별 회비·지출 요약</div></div>
    <div style="padding:0 1rem 1rem;overflow-x:auto;">
      <div id="monthlySummary" style="display:flex;gap:12px;min-width:600px;padding-top:8px;"></div>
    </div>
  </div>

</main>
</div>

<!-- 추가 회비 등록 모달 -->
<div id="feeModal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title">추가 회비 등록</div>
      <button class="btn" onclick="closeFeeModal()">닫기</button>
    </div>
    <div class="form-section">
      <div class="form-row">
        <div class="form-group">
          <label>멤버</label>
          <select id="fee-member" style="font-size:13px;"></select>
        </div>
        <div class="form-group">
          <label>반영 월</label>
          <input type="month" id="fee-month" style="font-size:13px;" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>추가 금액</label>
          <input type="number" id="fee-amount" placeholder="0" step="1000" style="font-size:13px;" />
        </div>
        <div class="form-group">
          <label>안내</label>
          <div style="font-size:12px;color:var(--muted);padding:9px 0;line-height:1.5;">정기 회비는 회원 수에 맞춰 자동 반영됩니다.</div>
        </div>
      </div>
      <div class="form-group">
        <label>메모</label>
        <input type="text" id="fee-note" placeholder="예: 회식 추가 회비" style="font-size:13px;" />
      </div>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:8px;">
        <button class="btn" onclick="closeFeeModal()">취소</button>
        <button class="btn btn-primary" onclick="saveFee()">저장</button>
      </div>
    </div>
  </div>
</div>

<!-- 지출 등록 모달 -->
<div id="expenseModal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title">지출 등록</div>
      <button class="btn" onclick="closeExpenseModal()">닫기</button>
    </div>
    <div class="form-section">
      <div class="form-row">
        <div class="form-group">
          <label>카테고리</label>
          <select id="exp-category" style="font-size:13px;">
            <option value="room">스터디룸</option>
            <option value="drink">음료</option>
            <option value="dinner">회식</option>
            <option value="other">기타</option>
          </select>
        </div>
        <div class="form-group">
          <label>지출일</label>
          <input type="date" id="exp-date" style="font-size:13px;" />
        </div>
      </div>
      <div class="form-group">
        <label>금액</label>
        <input type="number" id="exp-amount" placeholder="0" min="0" step="100" style="font-size:13px;" />
      </div>
      <div class="form-group">
        <label>메모</label>
        <input type="text" id="exp-note" placeholder="예: 스터디룸 4월 이용료" style="font-size:13px;" />
      </div>
      <div style="font-size:12px;color:var(--muted);line-height:1.5;">스터디룸 비용은 직전 실제 월의 금액이 자동 반복됩니다. 금액이 바뀐 달에만 새 금액을 등록하고, 반복을 멈추려면 0원을 등록하세요.</div>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:8px;">
        <button class="btn" onclick="closeExpenseModal()">취소</button>
        <button class="btn btn-primary" onclick="saveExpense()">저장</button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js?v=20260522"></script>
<script src="js/db.js?v=20260424"></script>
<script src="js/fees-auto.js"></script>
<script>
const REGULAR_FEE = 20000;
const AUTO_LEDGER_START_MONTH = '2026-04';
const {
  buildEffectiveFees,
  buildEffectiveExpenses,
  getMembersForMonth,
} = window.SSSFeeAutomation;

function feeWon(n) { return Math.abs(Math.round(n)).toLocaleString() + '원'; }
function signedFeeWon(n) { return (n < 0 ? '-' : n > 0 ? '+' : '') + feeWon(n); }
function localDateKey(date = new Date()) {
  return date.getFullYear() + '-' +
    String(date.getMonth() + 1).padStart(2, '0') + '-' +
    String(date.getDate()).padStart(2, '0');
}
const CAT_LABEL = { room:'스터디룸', drink:'음료', dinner:'회식', other:'기타' };
const CAT_CLASS  = { room:'cat-room', drink:'cat-drink', dinner:'cat-dinner', other:'cat-other' };

let members = [], storedFees = [], storedExpenses = [], fees = [], expenses = [];
let currentMember = null, isAdminUser = false;
let feeCurrentMonth = localDateKey().slice(0,7); // 'YYYY-MM'

// ── 월 이동
function changeMonth(delta) {
  const [y, m] = feeCurrentMonth.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  feeCurrentMonth = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  document.getElementById('currentMonthLabel').textContent = feeCurrentMonth.replace('-','년 ') + '월';
  renderSummary();
  renderFees();
  renderMonthlySummary();
}

// ── 데이터 렌더
function renderSummary() {
  const totalFeeAmt = fees.reduce((s,f) => s + f.amount, 0);
  const totalExpAmt = expenses.reduce((s,e) => s + e.amount, 0);
  const balance     = totalFeeAmt - totalExpAmt;

  const thisMonthFees = fees.filter(f => f.month === feeCurrentMonth);
  const thisMonthPaid = thisMonthFees.reduce((s,f) => s + f.amount, 0);

  document.getElementById('totalBalance').textContent  = (balance >= 0 ? '' : '-') + feeWon(balance);
  document.getElementById('totalFees').textContent     = feeWon(totalFeeAmt);
  document.getElementById('totalExpenses').textContent = feeWon(totalExpAmt);
  document.getElementById('thisMonthPaid').textContent = feeWon(thisMonthPaid);
}

function renderFees() {
  document.getElementById('currentMonthLabel').textContent = feeCurrentMonth.replace('-', '년 ') + '월';
  const todayMonth = localDateKey().slice(0,7);
  const beforeAutoStart = feeCurrentMonth < AUTO_LEDGER_START_MONTH;
  const isFutureMonth = feeCurrentMonth > todayMonth;
  const monthMembers = getMembersForMonth(members, feeCurrentMonth);
  const monthFees = fees.filter(f => f.month === feeCurrentMonth);
  const regularFees = monthFees.filter(f => f.fee_type === 'regular');
  const regularTotal = regularFees.reduce((sum, fee) => sum + fee.amount, 0);
  const extraTotal = monthFees
    .filter(f => f.fee_type === 'extra')
    .reduce((sum, fee) => sum + fee.amount, 0);
  const target = beforeAutoStart ? 0 : monthMembers.length * REGULAR_FEE;
  const pct = target > 0 ? Math.min(100, Math.round(regularTotal / target * 100)) : 0;

  // 진행률 바
  const prog = document.getElementById('feeProgress');
  if (beforeAutoStart) {
    prog.innerHTML = '<div style="font-size:12px;color:var(--muted);padding:8px 0;">월 회비 자동 반영은 2026년 4월부터 시작됩니다.</div>';
  } else {
    prog.innerHTML =
      '<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:4px;">' +
      '<span>월 회비 자동 반영</span><span>' + feeWon(regularTotal) + ' / ' + feeWon(target) + '</span></div>' +
      '<div class="total-bar"><div class="total-bar-fill" style="width:' + pct + '%"></div></div>' +
      '<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px;">' +
      '<span>활성 회원 ' + monthMembers.length + '명 × ' + feeWon(REGULAR_FEE) + '</span>' +
      (extraTotal ? '<span>추가 회비 +' + feeWon(extraTotal) + '</span>' : '<span>' + (isFutureMonth ? '반영 예정' : '자동 계산됨') + '</span>') +
      '</div>';
  }

  // 멤버별 회비 상태
  const list = document.getElementById('memberFeeList');
  list.innerHTML = '';
  if (beforeAutoStart) return;

  monthMembers.forEach(m => {
    const mFees   = monthFees.filter(f => f.member_id === m.id);
    const regular = mFees.filter(f => f.fee_type === 'regular');
    const extra   = mFees.filter(f => f.fee_type === 'extra');
    const storedRegular = storedFees.filter(f =>
      f.member_id === m.id && f.month === feeCurrentMonth && f.fee_type === 'regular'
    );
    const hasPaid = regular.length > 0;
    const isAutomatic = regular.some(f => f.is_auto);

    const row = document.createElement('div');
    row.className = 'member-fee-row';

    const av = document.createElement('div');
    av.className = 'avatar av1';
    av.style.cssText = 'width:28px;height:28px;font-size:11px;flex-shrink:0;';
    av.textContent = m.name.slice(0,2);

    const nameDiv = document.createElement('div');
    nameDiv.style.cssText = 'flex:1;font-size:13px;font-weight:500;';
    nameDiv.textContent = m.name;

    const badgeWrap = document.createElement('div');
    badgeWrap.style.cssText = 'display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end;';

    if (hasPaid) {
      const b = document.createElement('span');
      b.className = 'fee-badge fee-paid';
      b.textContent = (isAutomatic ? '자동 · ' : '기록 · ') + feeWon(regular.reduce((s,f)=>s+f.amount,0)) +
        (storedRegular.length > 1 ? ' · 중복 ' + (storedRegular.length - 1) + '건 제외' : '');
      badgeWrap.appendChild(b);
    } else {
      const b = document.createElement('span');
      b.className = 'fee-badge fee-auto';
      b.textContent = isFutureMonth ? '자동 반영 예정' : '자동 반영 대기';
      badgeWrap.appendChild(b);
    }
    if (extra.length > 0) {
      const b = document.createElement('span');
      b.className = 'fee-badge fee-extra';
      b.textContent = '+' + feeWon(extra.reduce((s,f)=>s+f.amount,0));
      badgeWrap.appendChild(b);
    }

    // 관리자: 기존 정기 회비 기록을 지우고 자동 계산으로 전환 가능
    if (isAdminUser && storedRegular.length > 0) {
      const convertBtn = document.createElement('button');
      convertBtn.style.cssText = 'background:none;border:none;cursor:pointer;color:#6b21a8;font-size:11px;padding:0 2px;';
      convertBtn.textContent = '자동 전환';
      convertBtn.title = '저장된 정기 회비 기록을 삭제하고 자동 계산으로 전환';
      convertBtn.onclick = async () => {
        const countText = storedRegular.length > 1 ? ' ' + storedRegular.length + '건을' : '을';
        if (!confirm(m.name + '님의 ' + feeCurrentMonth + ' 정기 회비 기록' + countText + ' 삭제하고 자동 계산으로 전환할까요?')) return;
        const { error } = await sb.from('study_fees').delete().in('id', storedRegular.map(f => f.id));
        if (error) { toast('정기 회비 기록 삭제 오류: ' + error.message); return; }
        await loadData();
      };
      badgeWrap.appendChild(convertBtn);
    }

    // 관리자: 수동으로 등록한 추가 회비만 삭제 가능
    const removableExtra = extra.filter(f => !f.is_auto && f.id);
    if (isAdminUser && removableExtra.length > 0) {
      const delBtn = document.createElement('button');
      delBtn.style.cssText = 'background:none;border:none;cursor:pointer;color:var(--muted);font-size:12px;padding:0 2px;';
      delBtn.textContent = '✕';
      delBtn.title = '이번 달 추가 회비 삭제';
      delBtn.onclick = async () => {
        if (!confirm(m.name + '님의 ' + feeCurrentMonth + ' 추가 회비 내역을 삭제할까요?')) return;
        const { error } = await sb.from('study_fees').delete().in('id', removableExtra.map(f => f.id));
        if (error) { toast('추가 회비 삭제 오류: ' + error.message); return; }
        await loadData();
      };
      badgeWrap.appendChild(delBtn);
    }

    row.appendChild(av);
    row.appendChild(nameDiv);
    row.appendChild(badgeWrap);
    list.appendChild(row);
  });
}

function renderExpenses() {
  const cat  = document.getElementById('expenseFilter').value;
  const list = cat ? expenses.filter(e => e.category === cat) : [...expenses];
  list.sort((a,b) => b.spent_at.localeCompare(a.spent_at));

  const el = document.getElementById('expenseList');
  el.innerHTML = '';

  if (!list.length) {
    el.innerHTML = '<div style="font-size:13px;color:var(--muted);padding:12px 0;text-align:center;">지출 내역이 없습니다</div>';
    return;
  }

  list.slice(0,30).forEach(e => {
    const row = document.createElement('div');
    row.className = 'expense-row';

    const catBadge = document.createElement('span');
    catBadge.className = 'fee-badge ' + (e.is_auto ? 'fee-auto' : (CAT_CLASS[e.category]||'cat-other'));
    catBadge.textContent = (CAT_LABEL[e.category]||e.category) + (e.is_auto ? ' · 자동' : '');

    const noteDiv = document.createElement('div');
    noteDiv.style.cssText = 'font-size:13px;min-width:0;';
    const noteTitle = document.createElement('div');
    noteTitle.style.fontWeight = '500';
    noteTitle.textContent = e.note || '—';
    const noteDate = document.createElement('div');
    noteDate.style.cssText = 'font-size:11px;color:var(--muted);';
    noteDate.textContent = e.spent_at + (e.is_auto && e.source_month ? ' · ' + e.source_month + ' 실제 금액 기준' : '');
    noteDiv.appendChild(noteTitle);
    noteDiv.appendChild(noteDate);

    const amtDiv = document.createElement('div');
    amtDiv.style.cssText = 'font-size:13px;font-weight:500;color:#a32d2d;white-space:nowrap;';
    amtDiv.textContent = e.category === 'room' && Number(e.amount) === 0 ? '반복 중지' : '-' + feeWon(e.amount);

    const actDiv = document.createElement('div');
    if (isAdminUser && !e.is_auto) {
      const delBtn = document.createElement('button');
      delBtn.style.cssText = 'background:none;border:none;cursor:pointer;color:var(--muted);font-size:12px;';
      delBtn.textContent = '✕';
      delBtn.onclick = async () => {
        const message = e.category === 'room'
          ? '이 스터디룸 실제 금액을 삭제하면 이후 월의 자동 반복 금액도 바뀔 수 있습니다. 삭제할까요?'
          : '지출 내역을 삭제할까요?';
        if (!confirm(message)) return;
        await sb.from('study_expenses').delete().eq('id', e.id);
        await loadData();
      };
      actDiv.appendChild(delBtn);
    }

    row.appendChild(catBadge);
    row.appendChild(noteDiv);
    row.appendChild(amtDiv);
    row.appendChild(actDiv);
    el.appendChild(row);
  });
}

function renderMonthlySummary() {
  // 최근 6개월 요약
  const months = [];
  const now = new Date();
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    months.push(d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'));
  }

  const el = document.getElementById('monthlySummary');
  el.innerHTML = '';
  const maxPaid = Math.max(...months.map(m => fees.filter(f=>f.month===m).reduce((s,f)=>s+f.amount,0)), 1);

  months.forEach(month => {
    const mFees = fees.filter(f => f.month === month);
    const mExps = expenses.filter(e => e.spent_at.slice(0,7) === month);
    const paid  = mFees.reduce((s,f)=>s+f.amount,0);
    const spent = mExps.reduce((s,e)=>s+e.amount,0);
    const net = paid - spent;
    const paidCount = new Set(mFees.filter(f=>f.fee_type==='regular').map(f=>f.member_id)).size;
    const memberCount = month >= AUTO_LEDGER_START_MONTH ? getMembersForMonth(members, month).length : 0;

    const col = document.createElement('div');
    col.style.cssText = 'flex:1;min-width:80px;cursor:pointer;';
    col.onclick = () => {
      feeCurrentMonth = month;
      renderSummary();
      renderFees();
      renderMonthlySummary();
    };

    const barH = Math.max(4, Math.round(paid / maxPaid * 80));
    col.innerHTML =
      '<div style="display:flex;flex-direction:column;align-items:center;gap:4px;">' +
        '<div style="font-size:11px;color:var(--muted);">회비 ' + feeWon(paid) + '</div>' +
        '<div style="width:32px;height:80px;background:var(--border);border-radius:4px;display:flex;align-items:flex-end;overflow:hidden;">' +
          '<div style="width:100%;height:' + barH + 'px;background:' + (month===feeCurrentMonth?'#185fa5':'#93c5fd') + ';border-radius:4px;transition:.3s;"></div>' +
        '</div>' +
        '<div style="font-size:10px;color:var(--muted);">' + month.slice(5) + '월</div>' +
        '<div style="font-size:10px;color:#0f6e56;">' + paidCount + '/' + memberCount + '명</div>' +
        '<div style="font-size:10px;color:#a32d2d;">지출 -' + feeWon(spent) + '</div>' +
        '<div style="font-size:10px;color:' + (net >= 0 ? '#0f6e56' : '#a32d2d') + ';">월 잔액 ' + signedFeeWon(net) + '</div>' +
      '</div>';

    el.appendChild(col);
  });
}

// ── 데이터 로드
async function loadData() {
  try {
    const [feesRes, expRes] = await Promise.all([
      sb.from('study_fees').select('*, members(name)').order('paid_at', {ascending:false}),
      sb.from('study_expenses').select('*').order('spent_at', {ascending:false}),
    ]);

    // 테이블 미생성 감지 (error code: 42P01)
    if (feesRes.error) {
      if (feesRes.error.code === '42P01') {
        document.getElementById('totalBalance').textContent = 'DB 테이블 미생성';
        toast('study_fees 테이블을 먼저 생성하세요. (add_presentations_columns.sql 참고)');
      } else {
        throw feesRes.error;
      }
      return;
    }
    if (expRes.error) throw expRes.error;

    storedFees = feesRes.data || [];
    storedExpenses = expRes.data || [];

    const throughMonth = localDateKey().slice(0,7);
    fees = buildEffectiveFees(storedFees, members, {
      monthlyFee: REGULAR_FEE,
      startMonth: AUTO_LEDGER_START_MONTH,
      throughMonth,
    });
    expenses = buildEffectiveExpenses(storedExpenses, {
      startMonth: AUTO_LEDGER_START_MONTH,
      throughMonth,
    });

    renderSummary();
    renderFees();
    renderExpenses();
    renderMonthlySummary();
  } catch(e) {
    console.error('loadData 오류:', e);
    toast('데이터 로드 오류: ' + (e.message || '알 수 없는 오류'));
  }
}

// ── 추가 회비 등록 모달
function openFeeModal() {
  const sel = document.getElementById('fee-member');
  sel.innerHTML = members.map(m => '<option value="'+m.id+'">'+m.name+'</option>').join('');
  document.getElementById('fee-month').value  = feeCurrentMonth;
  document.getElementById('fee-amount').value = '';
  document.getElementById('fee-note').value   = '';
  document.getElementById('feeModal').style.display = 'flex';
}
function closeFeeModal() { document.getElementById('feeModal').style.display = 'none'; }

async function saveFee() {
  const memberId = document.getElementById('fee-member').value;
  const month    = document.getElementById('fee-month').value;
  const amount   = parseInt(document.getElementById('fee-amount').value);
  const note     = document.getElementById('fee-note').value.trim() || null;

  if (!memberId || !month || !amount) { toast('모든 필드를 입력하세요.'); return; }

  const btn = document.querySelector('#feeModal .btn-primary');
  if (btn) { btn.textContent = '저장 중...'; btn.disabled = true; }

  try {
    const { error } = await sb.from('study_fees').insert({
      member_id: memberId, month, amount, fee_type: 'extra', note,
    });
    if (error) throw error;
    toast('✅ 추가 회비 등록 완료');
    closeFeeModal();
    await loadData();
  } catch(e) {
    toast('저장 오류: ' + (e.message || '알 수 없는 오류'));
  } finally {
    if (btn) { btn.textContent = '저장'; btn.disabled = false; }
  }
}

// ── 지출 등록 모달
function openExpenseModal() {
  const today = localDateKey();
  document.getElementById('exp-date').value     = today;
  document.getElementById('exp-amount').value   = '';
  document.getElementById('exp-note').value     = '';
  document.getElementById('exp-category').value = 'room';
  document.getElementById('expenseModal').style.display = 'flex';
}
function closeExpenseModal() { document.getElementById('expenseModal').style.display = 'none'; }

async function saveExpense() {
  const category = document.getElementById('exp-category').value;
  const amount   = parseInt(document.getElementById('exp-amount').value);
  const spentAt  = document.getElementById('exp-date').value;
  let note       = document.getElementById('exp-note').value.trim() || null;

  const validAmount = Number.isFinite(amount) && amount >= 0 && (category === 'room' || amount > 0);
  if (!validAmount || !spentAt) { toast('금액과 날짜를 입력하세요.'); return; }
  if (category === 'room' && amount === 0 && !note) note = '스터디룸 자동 반복 중지';

  const btn = document.querySelector('#expenseModal .btn-primary');
  if (btn) { btn.textContent = '저장 중...'; btn.disabled = true; }

  try {
    const { error } = await sb.from('study_expenses').insert({
      category, amount, spent_at: spentAt, note,
      created_by: currentMember?.id || null,
    });
    if (error) throw error;
    toast(category === 'room'
      ? (amount === 0 ? '✅ 스터디룸 자동 반복을 중지했습니다.' : '✅ 스터디룸 실제 금액 등록 완료 · 이후 월에 자동 반복됩니다.')
      : '✅ 지출 등록 완료');
    closeExpenseModal();
    await loadData();
  } catch(e) {
    toast('저장 오류: ' + (e.message || '알 수 없는 오류'));
  } finally {
    if (btn) { btn.textContent = '저장'; btn.disabled = false; }
  }
}

// ── 초기화
async function init() {
  await requireAuth();
  checkDBConnection();

  try {
    const [mem, me, adminFlag] = await Promise.all([
      fetchMembers(), getCurrentMember(), isAdmin()
    ]);
    members       = mem || [];
    currentMember = me;
    isAdminUser   = adminFlag;

    if (isAdminUser) {
      document.getElementById('adminBtns').style.display = 'flex';
    }

    await loadData();
  } catch(e) {
    console.error('init 오류:', e);
    toast('페이지 초기화 오류: ' + (e.message || '알 수 없는 오류'));
  }
}


init();
</script>
