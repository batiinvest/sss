    html, body { height: 100%; margin: 0; }
    .layout { height: 100vh; height: 100dvh; display: flex; overflow: hidden; }

    /* iframe */
    #page-frame {
      flex: 1;
      border: none;
      width: 100%;
      height: 100%;
      background: var(--bg);
      opacity: 1;
      transition: opacity 0.12s ease;
      display: block;

    #page-frame.switching { opacity: 0; }

    /* 모바일 */

      html { height: 100%; overflow: hidden; }
      body { height: 100%; overflow: hidden; }

        flex-direction: column;
        /* dvh 대신 고정 100% 사용 — 주소창 변동 시 레이아웃 재계산 방지 */
        height: 100%;
        overflow: hidden;

        position: fixed;
        inset: 0;
      }

        flex-shrink: 0;
        height: auto !important;
        position: relative !important;
        z-index: 200 !important;
      }
      #page-frame {
        flex: 1;
        min-height: 0;
        /* iframe 자체는 스크롤 없이 꽉 채움 */
        overflow: hidden;
        /* 내부 페이지가 스크롤 담당 (in-iframe 클래스로 처리) */
      }

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js?v=20260711.2"></script>
<script src="js/db.js?v=20260711.2"></script>
<script src="js/pwa.js?v=20260711.2"></script>
<script>
const APP_PAGES = new Set([
  'index', 'presentations', 'picks', 'trade', 'schedule-calendar',
  'schedule-order', 'fees', 'settle', 'members', 'mypage', 'admin'
]);
let currentPage = '';
let currentRoute = '';
let currentUserIsAdmin = false;
let searchTimer = null;
let searchRequestId = 0;
let sheetReturnFocus = null;

function normalizeRoute(input) {
  const raw = String(input || 'index').replace(/^#/, '');
  const queryIndex = raw.indexOf('?');
  let page = (queryIndex >= 0 ? raw.slice(0, queryIndex) : raw).toLowerCase();
  if (!APP_PAGES.has(page)) page = 'index';
  const params = new URLSearchParams(queryIndex >= 0 ? raw.slice(queryIndex + 1) : '');
  params.delete('v');
  const query = params.toString();
  return { page, route: page + (query ? '?' + query : ''), params };
}

function routeFrameSrc(route) {
  const parsed = normalizeRoute(route);
  const params = new URLSearchParams(parsed.params);
  params.set('v', '20260722.2');
  return parsed.page + '.html?' + params.toString();
}

function updateActiveNavigation(page) {
  document.querySelectorAll('[data-page]').forEach(el => {
    const active = el.dataset.page === page;
    el.classList.toggle('active', active);
    if (active) el.setAttribute('aria-current', 'page');
    else el.removeAttribute('aria-current');
  });
  const moreActive = !['index', 'presentations', 'picks'].includes(page);
  document.querySelector('[data-more-nav]')?.classList.toggle('active', moreActive);
}

function loadPage(route, options = {}) {
  let parsed = normalizeRoute(route);
  if (parsed.page === 'admin' && !currentUserIsAdmin) {
    toast('관리자만 접근할 수 있습니다.');
    parsed = normalizeRoute('index');
  }

  const frame = document.getElementById('page-frame');
  if (!options.force && currentRoute === parsed.route && frame.src.includes(parsed.page + '.html')) {
    closeAllSheets();
    return;
  }

  currentPage = parsed.page;
  currentRoute = parsed.route;
  updateActiveNavigation(parsed.page);
  closeAllSheets();

  const historyMode = options.historyMode || 'push';
  const state = { page: parsed.page, route: parsed.route };
  if (historyMode === 'replace') history.replaceState(state, '', '#' + parsed.route);
  else if (historyMode !== 'none') history.pushState(state, '', '#' + parsed.route);

  frame.classList.add('switching');
  frame.src = routeFrameSrc(parsed.route);
}

// iframe 안의 상세 모달이 닫힐 때 현재 화면을 다시 로드하지 않고
// 주소만 목록 상태로 정리한다. 필터와 스크롤 위치가 그대로 유지된다.
function replaceRouteState(route) {
  const parsed = normalizeRoute(route);
  currentPage = parsed.page;
  currentRoute = parsed.route;
  updateActiveNavigation(parsed.page);
  history.replaceState({ page: parsed.page, route: parsed.route }, '', '#' + parsed.route);
}

function syncRouteFromFrame() {
  const frame = document.getElementById('page-frame');
  frame.classList.remove('switching');
  document.querySelector('.sidebar')?.classList.remove('nav-open');
  try {
    const url = new URL(frame.contentWindow.location.href);
    const file = url.pathname.split('/').pop() || '';
    const page = file.replace(/\.html$/i, '');
    if (!APP_PAGES.has(page)) return;
    url.searchParams.delete('v');
    const query = url.searchParams.toString();
    const actual = normalizeRoute(page + (query ? '?' + query : ''));
    if (actual.route === currentRoute) return;
    currentPage = actual.page;
    currentRoute = actual.route;
    updateActiveNavigation(actual.page);
    history.pushState({ page: actual.page, route: actual.route }, '', '#' + actual.route);
  } catch (error) {
    // about:blank 또는 아직 로드 중인 iframe은 동기화 대상이 아니다.
  }
}

document.getElementById('page-frame').addEventListener('load', syncRouteFromFrame);

// 뒤로가기/앞으로가기에서는 새 히스토리를 추가하지 않는다.
window.addEventListener('popstate', event => {
  const route = event.state?.route || location.hash.replace(/^#/, '') || 'index';
  loadPage(route, { historyMode: 'none', force: true });
});

// 로그아웃
async function doLogout() {
  sessionStorage.removeItem('sideProfileData');
  sessionStorage.removeItem('app_authenticated');
  await sb.auth.signOut();
  location.reload();
}

// iframe에서 세션 만료 메시지 수신
window.addEventListener('message', (e) => {
  try {
    const frame = document.getElementById('page-frame');
    if (e.source === frame.contentWindow && e.data === 'session_expired') {
      doLogout();
    }
  } catch(err) {
    // 확장프로그램 등 외부 메시지 채널 오류 무시
  }
});

// 초기 실행
async function initApp() {
  const session = await requireAuth();
  if (!session) return;
  currentUserIsAdmin = await isAdmin();
  initSidebarAuth();
  document.getElementById('mobileAdminMenu').hidden = !currentUserIsAdmin;

  // 인증 완료 표시 (iframe에서 세션 공유 확인용)
  sessionStorage.setItem('app_authenticated', '1');

  const initialRoute = location.hash.replace(/^#/, '') || 'index';
  loadPage(initialRoute, { historyMode: 'replace', force: true });
}

function setSheetOpen(id, open) {
  const sheet = document.getElementById(id);
  if (!sheet) return;
  if (open) {
    sheetReturnFocus = document.activeElement;
    sheet.hidden = false;
    requestAnimationFrame(() => sheet.classList.add('open'));
    document.body.classList.add('sheet-open');
    setTimeout(() => sheet.querySelector('input, button:not(.app-sheet-backdrop)')?.focus(), 0);
  } else {
    sheet.classList.remove('open');
    sheet.hidden = true;
    if (!document.querySelector('.app-sheet.open')) document.body.classList.remove('sheet-open');
  }
}

function closeAllSheets() {
  ['globalSearch', 'quickAddSheet', 'moreMenuSheet'].forEach(id => setSheetOpen(id, false));
}

function openGlobalSearch() {
  setSheetOpen('globalSearch', true);
  document.querySelector('[data-search-nav]')?.classList.add('active');
  const input = document.getElementById('globalSearchInput');
  if (!input.value.trim()) renderRecentSearches();
  setTimeout(() => input.focus(), 0);
}

function closeGlobalSearch() {
  searchRequestId++;
  setSheetOpen('globalSearch', false);
  document.querySelector('[data-search-nav]')?.classList.remove('active');
  sheetReturnFocus?.focus?.();
}

function openQuickAdd() { setSheetOpen('quickAddSheet', true); }
function closeQuickAdd() { setSheetOpen('quickAddSheet', false); }
function openMoreMenu() { setSheetOpen('moreMenuSheet', true); }
function closeMoreMenu() { setSheetOpen('moreMenuSheet', false); }
function runQuickRoute(route) { closeQuickAdd(); loadPage(route); }
function runMoreRoute(route) { closeMoreMenu(); loadPage(route); }

function recentSearches() {
  try { return JSON.parse(localStorage.getItem('sss_recent_searches') || '[]'); }
  catch (error) { return []; }
}

function rememberSearch(item) {
  const next = [item, ...recentSearches().filter(saved => saved.route !== item.route)].slice(0, 5);
  localStorage.setItem('sss_recent_searches', JSON.stringify(next));
}

function bindSearchResultButtons() {
  document.querySelectorAll('#globalSearchResults [data-route]').forEach(button => {
    button.addEventListener('click', () => {
      const item = { route: button.dataset.route, label: button.dataset.label || button.textContent.trim() };
      rememberSearch(item);
      closeGlobalSearch();
      loadPage(item.route);
    });
  });
}

function renderRecentSearches() {
  const results = document.getElementById('globalSearchResults');
  const saved = recentSearches();
  if (!saved.length) {
    results.innerHTML = '<div class="search-empty"><strong>종목을 빠르게 찾아보세요.</strong><span>발표종목과 투자종목을 한 번에 검색할 수 있습니다.</span></div>';
    return;
  }
  results.innerHTML = '<div class="search-section-title">최근 본 종목</div>' + saved.map(item =>
    `<button type="button" class="search-result-row" data-route="${escapeHtml(item.route)}" data-label="${escapeHtml(item.label)}"><span class="search-result-icon" aria-hidden="true">↻</span><span><strong>${escapeHtml(item.label)}</strong><small>최근 검색</small></span><span aria-hidden="true">›</span></button>`
  ).join('');
  bindSearchResultButtons();
}

function investmentStateLabel(pick) {
  if (pick.status === 'sold') return '매도 완료';
  if (Number(pick.buy_quantity) > 0 || Number(pick.buy_price) > 0) return '투자 진행';
  return '매수 대기';
}

async function runGlobalSearch(rawQuery) {
  const results = document.getElementById('globalSearchResults');
  const query = rawQuery.trim();
  if (query.length < 2) { renderRecentSearches(); return; }
  const term = query.replace(/[%_,().]/g, ' ').trim();
  if (term.length < 2) return;
  results.innerHTML = '<div class="search-loading"><span class="loading-spinner"></span>검색 중…</div>';
  const requestId = ++searchRequestId;

  try {
    const [stocks, presResult, pickResult] = await Promise.all([
      searchStockPrices(term, 8),
      sb.from('presentations')
        .select('id,topic,stock_code,status,presented_at,category,members(name)')
        .or(`topic.ilike.%${term}%,stock_code.ilike.%${term}%`)
        .order('presented_at', { ascending: false }).limit(8),
      sb.from('picks_with_trades')
        .select('pick_id,stock_name,stock_code,status,member_name,month,buy_price,buy_quantity,realized_return')
        .or(`stock_name.ilike.%${term}%,stock_code.ilike.%${term}%`)
        .order('month', { ascending: false }).limit(8)
    ]);
    const presentations = presResult.data || [];
    const picks = pickResult.data || [];
    if (requestId !== searchRequestId) return;
    if (presResult.error || pickResult.error) throw presResult.error || pickResult.error;
    if (!presentations.length && !picks.length && !stocks.length) {
      results.innerHTML = '<div class="search-empty"><strong>검색 결과가 없습니다.</strong><span>종목명이나 코드를 다시 확인해 보세요.</span></div>';
      return;
    }

    let html = '';
    if (presentations.length) {
      html += '<div class="search-section-title">발표종목</div>' + presentations.map(item => {
        const name = String(item.topic || '').split('>').pop().trim();
        const meta = [item.members?.name, item.presented_at].filter(Boolean).join(' · ');
        return `<button type="button" class="search-result-row" data-route="presentations?id=${encodeURIComponent(item.id)}" data-label="${escapeHtml(name)}"><span class="search-result-icon search-result-pres" aria-hidden="true">▤</span><span><strong>${escapeHtml(name)}</strong><small>${escapeHtml(meta || '발표종목')}</small></span><span class="search-result-state">${item.status === 'planned' ? '예정' : '발표 완료'}</span></button>`;
      }).join('');
    }
    if (picks.length) {
      html += '<div class="search-section-title">투자종목</div>' + picks.map(item =>
        `<button type="button" class="search-result-row" data-route="picks?id=${encodeURIComponent(item.pick_id)}" data-label="${escapeHtml(item.stock_name)}"><span class="search-result-icon search-result-pick" aria-hidden="true">◇</span><span><strong>${escapeHtml(item.stock_name)}</strong><small>${escapeHtml([item.member_name, item.stock_code].filter(Boolean).join(' · '))}</small></span><span class="search-result-state">${investmentStateLabel(item)}</span></button>`
      ).join('');
    }
    if (stocks.length) {
      html += '<div class="search-section-title">전체 종목</div>' + stocks.slice(0, 5).map(item =>
        `<button type="button" class="search-result-row" data-route="picks?search=${encodeURIComponent(item.stock_name)}" data-label="${escapeHtml(item.stock_name)}"><span class="search-result-icon" aria-hidden="true">⌕</span><span><strong>${escapeHtml(item.stock_name)}</strong><small>${escapeHtml(item.stock_code + ' · ' + (item.market || ''))}</small></span><span class="search-result-price">${item.price ? Number(item.price).toLocaleString('ko-KR') + '원' : '—'}</span></button>`
      ).join('');
    }
    results.innerHTML = html;
    bindSearchResultButtons();
  } catch (error) {
    if (requestId !== searchRequestId) return;
    results.innerHTML = '<div class="search-empty search-error"><strong>검색하지 못했습니다.</strong><span>네트워크를 확인하고 다시 입력해 주세요.</span></div>';
  }
}

document.getElementById('globalSearchInput').addEventListener('input', event => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => runGlobalSearch(event.target.value), 280);
});

document.addEventListener('keydown', event => {
  if (event.key === 'Escape') closeAllSheets();
});

initApp();
</script>
</body>
</html>
