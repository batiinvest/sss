<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSS · 발표 관리 · 발표 기록</title>
  <link rel="stylesheet" href="css/style.css?v=20260725.10">
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      if (window === window.parent && params.get('view') === 'prepare') {
        params.delete('view');
        const query = params.toString();
        location.replace('schedule-order.html' + (query ? '?' + query : ''));
        return;
      }
      if (window !== window.parent) document.documentElement.classList.add('in-iframe');
    })();
  </script>

</head>
<body>

<div class="layout layout-page"><main class="main">
    <div id="db-banner" class="db-banner pending">DB 연결 확인 중...</div>

    <div class="topbar schedule-topbar">
      <div>
        <h1 class="page-title">발표 관리</h1>
        <div class="updated" id="priceUpdatedAt">다가오는 발표를 준비하고 지난 발표 성과를 확인합니다.</div>
      </div>
      <nav class="schedule-view-tabs" aria-label="발표 관리 화면 전환">
        <button type="button" onclick="navigateToAppRoute('presentations?view=prepare')">준비 중</button>
        <button type="button" class="active" aria-current="page">발표 기록</button>
      </nav>
    </div>

    <div class="presentation-history-controls desktop-filter-controls" aria-label="발표 기록 필터">
      <select id="filterMember" aria-label="발표자 필터" onchange="applyFilter()">
        <option value="">전체 발표자</option>
      </select>
      <select id="filterCategory" aria-label="발표 구분 필터" onchange="applyFilter()">
        <option value="">전체 구분</option>
        <option value="industry">산업 분석</option>
        <option value="stock">기업 분석</option>
      </select>
    </div>

    <div class="mobile-only mobile-page-tools">
      <label class="mobile-page-search" for="presentationSearch"><span aria-hidden="true">⌕</span><input type="search" id="presentationSearch" placeholder="종목명 또는 코드 검색" autocomplete="off"></label>
      <button type="button" class="btn mobile-filter-toggle" onclick="togglePresentationFilters()" aria-controls="presentationMobileFilters" aria-expanded="false">필터</button>
    </div>
    <div id="presentationMobileFilters" class="mobile-only mobile-filter-panel" hidden>
      <label>발표자<select id="mobileFilterMember" onchange="applyMobilePresentationFilters()"><option value="">전체 발표자</option></select></label>
      <label>구분<select id="mobileFilterCategory" onchange="applyMobilePresentationFilters()"><option value="">전체 구분</option><option value="industry">산업 분석</option><option value="stock">기업 분석</option></select></label>
      <button type="button" class="btn" onclick="resetPresentationFilters()">필터 초기화</button>
    </div>
    <div id="mobilePresentationList" class="mobile-stock-list" aria-live="polite"><div class="mobile-list-skeleton"></div><div class="mobile-list-skeleton"></div></div>

    <!-- 요약 카드 -->
    <div id="summaryCards" class="metric-grid mb-card desktop-summary-on-mobile"></div>

    <!-- 산업별 수익률 -->
    <div class="card mb-card desktop-summary-on-mobile" id="industrySection">
      <div class="card-head">
        <div class="card-title">산업별 평균 수익률</div>
        <div style="font-size:12px;color:var(--muted);">산업 분석 기준</div>
      </div>
      <div id="industryCards" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;"></div>
    </div>

    <!-- 기업별 수익률 -->
    <div class="card mb-card desktop-summary-on-mobile" id="memberSection">
      <div class="card-head">
        <div class="card-title">기업별 평균 수익률</div>
        <div style="font-size:12px;color:var(--muted);">발표자별 · 기업 분석 종목 기준</div>
      </div>
      <div id="memberCards" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;"></div>
    </div>

    <!-- 전체 발표 히스토리 -->
    <div class="card desktop-history-shell-on-mobile">
      <div class="card-head">
        <div class="card-title">발표 히스토리</div>
        <div style="font-size:12px;color:var(--muted);" id="countLabel"></div>
      </div>
      <div class="table-wrap desktop-table-on-mobile">
        <table id="histTable">
          <caption class="sr-only">발표종목별 발표일, 발표자, 발표 당시 가격, 현재가와 수익률</caption>
          <thead>
            <tr>
              <th>발표일</th>
              <th>발표자</th>
              <th>산업/테마</th>
              <th>종목</th>
              <th style="text-align:right;">발표 당시가</th>
              <th style="text-align:right;">현재가</th>
              <th style="text-align:right;">수익률</th>
              <th style="text-align:right;">시총 (발표시)</th>
              <th style="text-align:right;">시총 (현재)</th>
              <th style="text-align:right;">시총 변화</th>
            </tr>
          </thead>
          <tbody id="histTbody">
            <tr><td colspan="10" class="empty-cell">불러오는 중...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>
</div>
<div id="toast" class="toast"></div>

<div id="presentationDetailModal" class="detail-overlay" role="dialog" aria-modal="true" aria-labelledby="presentationDetailTitle" onclick="if(event.target===this) closePresentationDetail()">
  <section class="detail-panel">
    <div class="detail-head">
      <div><h2 id="presentationDetailTitle" class="detail-title">발표종목</h2><p id="presentationDetailSubtitle" class="detail-subtitle"></p></div>
      <button type="button" class="detail-close" onclick="closePresentationDetail()" aria-label="상세 닫기">×</button>
    </div>
    <div id="presentationDetailBody"></div>
    <div class="detail-actions">
      <button type="button" class="btn" id="presentationShareBtn">공유 링크 복사</button>
      <button type="button" class="btn btn-primary" id="presentationConvertBtn">투자종목으로 전환</button>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js?v=20260711.2"></script>
<script src="js/utils/returns.js?v=20260529"></script>
<script src="js/utils/presentation.js?v=20260529"></script>
<script src="js/services/price-service.js?v=20260529"></script>
<script src="js/db.js?v=20260711.2"></script>
<script>
let allData  = [];
let members  = [];
let priceMap = {};
let presentationSearchTerm = '';
let presentationDetailId = null;
let presentationDetailReturnFocus = null;

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}

async function init() {
  const session = await requireAuth();
  if (!session) return;
  checkDBConnection();

  const tbody = document.getElementById('histTbody');
  try {
    const pageData = await loadPresentationPageData();
    if (pageData.presentations === undefined) {
      tbody.innerHTML = '<tr><td colspan="10" class="empty-cell">presentations 테이블을 먼저 생성하세요. (supabase_add_presentations.sql 실행)</td></tr>';
      return;
    }

    // 목록 조회는 상태를 변경하지 않는다. 완료 처리는 일정/관리 흐름에서만 수행한다.
    allData = pageData.presentations || [];
    members = pageData.members || [];
    populateMemberFilter(members);
    populateMobileMemberFilter(members);

    if (!allData.length) {
      renderAll([]);
      return;
    }

    await loadPresentationPriceContext();
  } catch(e) {
    console.error('발표 히스토리 초기화 오류:', e.message);
    tbody.innerHTML = '<tr><td colspan="10" class="empty-cell">데이터 로드 오류: ' + e.message + '</td></tr>';
    return;
  }

  const params = new URLSearchParams(location.search);
  const search = params.get('search');
  if (search) {
    presentationSearchTerm = search.trim().toLowerCase();
    document.getElementById('presentationSearch').value = search;
  }
  renderAll(getFilteredData());

  const detailId = params.get('id');
  if (detailId) await openPresentationDetail(detailId);
}

async function loadPresentationPageData() {
  const [{ data: presentations }, memberData] = await Promise.all([
    sb.from('presentations')
      .select('*, members(name)')
      .order('presented_at', { ascending: false })
      .order('created_at',   { ascending: true }),
    fetchMembers()
  ]);
  return { presentations, members: memberData || [] };
}

function populateMemberFilter(memberRows) {
  const sel = document.getElementById('filterMember');
  if (!sel) return;
  sel.innerHTML = '<option value="">전체 멤버</option>';
  memberRows.forEach(m => sel.innerHTML += `<option value="${escapeHtml(m.id)}">${escapeHtml(m.name)}</option>`);
}

function populateMobileMemberFilter(memberRows) {
  const select = document.getElementById('mobileFilterMember');
  if (!select) return;
  select.innerHTML = '<option value="">전체 발표자</option>' + memberRows.map(member =>
    `<option value="${escapeHtml(member.id)}">${escapeHtml(member.name)}</option>`
  ).join('');
}

function togglePresentationFilters() {
  const panel = document.getElementById('presentationMobileFilters');
  const button = document.querySelector('.mobile-filter-toggle');
  const willOpen = panel.hidden;
  panel.hidden = !willOpen;
  button.setAttribute('aria-expanded', String(willOpen));
}

function applyMobilePresentationFilters() {
  document.getElementById('filterMember').value = document.getElementById('mobileFilterMember').value;
  document.getElementById('filterCategory').value = document.getElementById('mobileFilterCategory').value;
  renderAll(getFilteredData());
}

function resetPresentationFilters() {
  presentationSearchTerm = '';
  document.getElementById('presentationSearch').value = '';
  document.getElementById('mobileFilterMember').value = '';
  document.getElementById('mobileFilterCategory').value = '';
  applyMobilePresentationFilters();
}

async function loadPresentationPriceContext() {
  try {
    // 1. stock_code 있는 항목 - 코드로 직접 조회
    const codes = [...new Set(allData.filter(p => p.stock_code).map(p => p.stock_code))];

    // 2. stock_code 없는 항목 - 종목명 수집
    const noCodeItems  = allData.filter(p => !p.stock_code);
    const stockNames   = [...new Set(
      noCodeItems
        .map(p => parseStockName(p))
        .filter(n => n && n.length >= 2)
    )];

    // 코드 조회 + 종목명 OR 조회를 동시에 실행
    const [codePriceMap, nameRows] = await Promise.all([
      fetchPriceMapByCodes(codes),
      fetchPriceRowsByNames(stockNames)
    ]);

    const allPrices = [...Object.values(codePriceMap), ...nameRows.map(normalizePriceRow).filter(Boolean)];

    // priceMap 구성
    priceMap = mergePriceMaps(priceMap, codePriceMap, buildPriceMap(nameRows));

    // stock_code 없는 이전 데이터는 화면 안에서만 정확히 매칭한다.
    // 조회만으로 DB를 수정하지 않는다.
    for (const item of noCodeItems) {
      const sName = parseStockName(item);
      if (!sName || sName.length < 2) continue;

      // 완전 일치만 사용 (포함 검색은 "드림씨아이에스" 같은 오매칭 발생)
      const matched = allPrices.find(sp => sp.stock_name === sName);

      if (matched) {
        item.stock_code = matched.stock_code;
        priceMap[matched.stock_code] = matched;
      }
    }

    // 마지막 업데이트 시각
    const latest = allPrices
      .filter(p => p.updated_at)
      .sort((a,b) => new Date(b.updated_at) - new Date(a.updated_at))[0];
    if (latest) {
      const d = new Date(latest.updated_at);
      document.getElementById('priceUpdatedAt').textContent =
        `현재가 기준: ${d.toLocaleDateString('ko-KR')} ${d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}`;
    }
  } catch(e) {
    console.warn('현재가 조회 오류:', e.message);
  }
}

function applyFilter() {
  document.getElementById('mobileFilterMember').value = document.getElementById('filterMember').value;
  document.getElementById('mobileFilterCategory').value = document.getElementById('filterCategory').value;
  renderAll(getFilteredData());
}

function getCurPrice(p) {
  if (p.stock_code && priceMap[p.stock_code]) return priceMap[p.stock_code];
  // stock_code 없으면 종목명으로 검색
  const sName = parseStockName(p);
  return Object.values(priceMap).find(sp =>
    sp.stock_name === sName ||
    sp.stock_name?.includes(sName) ||
    sName?.includes(sp.stock_name)
  ) || null;
}

function getReturn(p) {
  const cur = getCurPrice(p);
  return calcReturnRate(p.price_at, cur?.price);
}

function getCapReturn(p) {
  const cur = getCurPrice(p);
  if (!cur?.market_cap) return null;
  if (p.price_at && cur.price) {
    return calcMarketCapReturn(calcMarketCapAt(p.price_at, cur.price, cur.market_cap), cur.market_cap);
  }
  return calcMarketCapReturn(p.market_cap_at, cur.market_cap);
}

// 산업명 추출 (topic = "테마명 > 종목명" 또는 "종목명")
function parseIndustry(p) {
  return parsePresentationIndustry(p);
}

function parseStockName(p) {
  return parsePresentationStockName(p);
}

function renderAll(data) {
  renderPresentationCards(data);
  if (window.matchMedia('(max-width: 768px)').matches) return;
  renderSummary(data);
  renderIndustryCards(data);
  renderMemberCards(data);
  renderTable(data);
}

function renderPresentationCards(data) {
  const container = document.getElementById('mobilePresentationList');
  if (!container) return;
  if (!data.length) {
    const hasFilter = presentationSearchTerm || document.getElementById('filterMember').value || document.getElementById('filterCategory').value;
    container.innerHTML = hasFilter
      ? '<div class="mobile-empty-state"><strong>조건에 맞는 발표종목이 없습니다.</strong><span>필터를 초기화하거나 다른 종목을 검색해 보세요.</span><button type="button" class="btn" onclick="resetPresentationFilters()">필터 초기화</button></div>'
      : '<div class="mobile-empty-state"><strong>아직 완료된 발표 기록이 없습니다.</strong><span>준비 중 화면에서 다음 발표를 확인해 보세요.</span><button type="button" class="btn btn-primary" onclick="navigateToAppRoute(\'presentations?view=prepare\')">준비 중 보기</button></div>';
    return;
  }

  container.innerHTML = data.map(item => {
    const current = getCurPrice(item);
    const rate = getReturn(item);
    const stockName = parseStockName(item);
    const memberName = item.members?.name || '발표자 미정';
    const status = item.status === 'planned' ? '발표 예정' : '발표 완료';
    return `<button type="button" class="mobile-stock-card" onclick="openPresentationDetail('${escapeHtml(item.id)}')">
      <span class="mobile-stock-card-head"><strong>${escapeHtml(stockName)}</strong><span class="badge ${item.status === 'planned' ? 'b-warn' : 'b-sold'}">${status}</span></span>
      <span class="mobile-stock-card-meta">${escapeHtml(memberName)} · ${escapeHtml(item.presented_at || '날짜 미정')} ${item.stock_code ? '· ' + escapeHtml(item.stock_code) : ''}</span>
      <span class="mobile-stock-card-metrics">
        <span>발표 당시가<strong>${item.price_at ? Number(item.price_at).toLocaleString('ko-KR') + '원' : '—'}</strong></span>
        <span>현재가<strong>${current?.price ? Number(current.price).toLocaleString('ko-KR') + '원' : '—'}</strong></span>
        <span>발표 후 수익률<strong class="${rate === null ? '' : rate >= 0 ? 'up' : 'dn'}">${rate === null ? '—' : (rate >= 0 ? '+' : '') + rate.toFixed(1) + '%'}</strong></span>
      </span>
      <span class="mobile-stock-card-foot">최근 정보 · ${escapeHtml(item.updated_at ? fmtDate(item.updated_at) : item.presented_at || '업데이트 없음')}</span>
    </button>`;
  }).join('');
}

function renderSummary(data) {
  const withRet = data.filter(p => getReturn(p) !== null);
  const returns = withRet.map(p => getReturn(p));
  const avg     = returns.length ? returns.reduce((s,r) => s+r, 0) / returns.length : null;
  const pos     = returns.filter(r => r > 0).length;
  const best    = returns.length ? Math.max(...returns) : null;
  const bestP   = best !== null ? withRet[returns.indexOf(best)] : null;

  document.getElementById('summaryCards').innerHTML = `
    <div class="metric">
      <div class="metric-label">총 발표 종목</div>
      <div class="metric-value">${data.length}건</div>
      <div class="metric-sub">주가 비교 가능: ${withRet.length}건</div>
    </div>
    <div class="metric">
      <div class="metric-label">평균 수익률</div>
      <div class="metric-value ${avg === null ? '' : avg >= 0 ? 'up' : 'dn'}">
        ${avg === null ? '—' : (avg >= 0 ? '+' : '') + avg.toFixed(1) + '%'}
      </div>
      <div class="metric-sub">주가 데이터 있는 종목 기준</div>
    </div>
    <div class="metric">
      <div class="metric-label">수익 종목 비율</div>
      <div class="metric-value ${pos > 0 ? 'up' : ''}">
        ${withRet.length ? Math.round(pos/withRet.length*100) + '%' : '—'}
      </div>
      <div class="metric-sub">${pos} / ${withRet.length}건</div>
    </div>
    <div class="metric">
      <div class="metric-label">최고 수익</div>
      <div class="metric-value up">${best !== null ? '+' + best.toFixed(1) + '%' : '—'}</div>
      <div class="metric-sub">${bestP ? escapeHtml(parseStockName(bestP) + ' · ' + (bestP.members?.name||'')) : '—'}</div>
    </div>`;
}

function renderIndustryCards(data) {
  // 산업 분석만 필터링 (기업 분석 제외)
  const industryOnly = data.filter(p => p.category === 'industry');
  const industryMap = {};
  industryOnly.forEach(p => {
    const ind = parseIndustry(p) || '기타';
    if (!industryMap[ind]) industryMap[ind] = [];
    industryMap[ind].push(p);
  });

  const el = document.getElementById('industryCards');
  const entries = Object.entries(industryMap)
    .map(([ind, items]) => {
      const rets = items.map(p => getReturn(p)).filter(r => r !== null);
      const avg  = rets.length ? rets.reduce((s,r) => s+r, 0) / rets.length : null;
      return { ind, items, avg, rets };
    })
    .sort((a,b) => (b.avg||0) - (a.avg||0));

  if (!entries.length) { el.innerHTML = '<div class="muted">데이터 없음</div>'; return; }

  el.innerHTML = entries.map(({ ind, items, avg, rets }) => {
    const cls  = avg === null ? '' : avg >= 0 ? 'up' : 'dn';
    const sign = avg !== null && avg >= 0 ? '+' : '';
    const isIndustry = ind !== '기업 분석';
    return `<div class="metric" style="cursor:default;">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">
        ${isIndustry
          ? `<span class="industry-tag">${escapeHtml(ind)}</span>`
          : `<span class="stock-tag">${escapeHtml(ind)}</span>`}
      </div>
      <div class="metric-value ${cls}" style="font-size:20px;">
        ${avg === null ? '—' : sign + avg.toFixed(1) + '%'}
      </div>
      <div class="metric-sub">${items.length}종목 · 비교가능 ${rets.length}건</div>
    </div>`;
  }).join('');
}

function renderMemberCards(data) {
  const el = document.getElementById('memberCards');
  if (!el) return;

  // 기업 분석만 필터링
  const stockOnly = data.filter(p => p.category === 'stock');

  // 발표자별 그룹핑
  const memberMap = {};
  stockOnly.forEach(p => {
    const name = p.members?.name || '—';
    if (!memberMap[name]) memberMap[name] = { name, memberId: p.member_id, items: [] };
    memberMap[name].items.push(p);
  });

  const entries = Object.values(memberMap)
    .map(({ name, memberId, items }) => {
      const rets  = items.map(p => getReturn(p)).filter(r => r !== null);
      const avg   = rets.length ? rets.reduce((s,r) => s+r, 0) / rets.length : null;
      const avIdx = members.findIndex(m => m.id === memberId) % 6;
      return { name, memberId, items, avg, rets, avIdx };
    })
    .sort((a,b) => (b.avg ?? -Infinity) - (a.avg ?? -Infinity));

  if (!entries.length) {
    el.innerHTML = '<div class="muted" style="padding:1rem;text-align:center;font-size:13px;">기업 분석 발표 내역이 없습니다</div>';
    return;
  }

  el.innerHTML = entries.map(({ name, items, avg, rets, avIdx }) => {
    const cls  = avg === null ? '' : avg >= 0 ? 'up' : 'dn';
    const sign = avg !== null && avg >= 0 ? '+' : '';
    return '<div class="metric" style="cursor:default;">' +
      '<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">' +
        '<div class="avatar ' + avCls[avIdx] + '" style="width:22px;height:22px;font-size:9px;">' + escapeHtml(name.slice(0,2)) + '</div>' +
        '<span style="font-size:13px;font-weight:500;">' + escapeHtml(name) + '</span>' +
      '</div>' +
      '<div class="metric-value ' + cls + '" style="font-size:20px;">' +
        (avg === null ? '—' : sign + avg.toFixed(1) + '%') +
      '</div>' +
      '<div class="metric-sub">' + items.length + '종목 · 비교가능 ' + rets.length + '건</div>' +
    '</div>';
  }).join('');
}

async function openPresentationDetail(id) {
  const item = allData.find(row => String(row.id) === String(id));
  if (!item) {
    toast('발표종목을 찾을 수 없습니다.');
    return;
  }
  if (item.status === 'planned') {
    const route = 'presentations?view=prepare' +
      (item.schedule_id ? '&schedule=' + encodeURIComponent(item.schedule_id) : '');
    navigateToAppRoute(route);
    return;
  }
  presentationDetailId = item.id;
  presentationDetailReturnFocus = document.activeElement;
  const modal = document.getElementById('presentationDetailModal');
  const title = document.getElementById('presentationDetailTitle');
  const subtitle = document.getElementById('presentationDetailSubtitle');
  const body = document.getElementById('presentationDetailBody');
  title.textContent = parseStockName(item);
  subtitle.textContent = [item.stock_code, item.members?.name, item.presented_at].filter(Boolean).join(' · ');
  modal.classList.add('open');
  document.body.style.overflow = 'hidden';
  body.innerHTML = '<div class="search-loading"><span class="loading-spinner"></span>상세 정보를 불러오는 중…</div>';
  modal.querySelector('.detail-close').focus();

  let linkedPick = null;
  if (item.stock_code) {
    const { data } = await sb.from('picks_with_trades')
      .select('pick_id,stock_name,stock_code,status,member_name,month,target_price,target_cap,reason,buy_price,buy_quantity,sell_price,realized_return')
      .eq('stock_code', item.stock_code)
      .order('month', { ascending: false })
      .limit(1);
    linkedPick = data?.[0] || null;
  }

  // 상세을 불러오는 동안 다른 카드를 열었으면 오래된 응답은 그리지 않는다.
  if (String(presentationDetailId) !== String(item.id)) return;
  const current = getCurPrice(item);
  const rate = getReturn(item);
  const targetPrice = linkedPick?.target_price || null;
  const targetCap = item.target_cap || linkedPick?.target_cap || null;
  const opinion = item.reason || linkedPick?.reason || '';
  const risk = item.risk || '';
  const isInvesting = linkedPick && (Number(linkedPick.buy_quantity) > 0 || Number(linkedPick.buy_price) > 0);
  const statusLabel = item.status === 'planned' ? '발표 예정' : '발표 완료';

  body.innerHTML = `
    <div class="detail-hero">
      <div><span>현재가</span><strong>${current?.price ? Number(current.price).toLocaleString('ko-KR') + '원' : '—'}</strong></div>
      <div><span>발표 후 수익률</span><strong class="${rate === null ? '' : rate >= 0 ? 'up' : 'dn'}">${rate === null ? '—' : (rate >= 0 ? '+' : '') + rate.toFixed(1) + '%'}</strong></div>
      <div><span>목표주가</span><strong>${targetPrice ? Number(targetPrice).toLocaleString('ko-KR') + '원' : '미등록'}</strong></div>
      <div><span>발표 당시가</span><strong>${item.price_at ? Number(item.price_at).toLocaleString('ko-KR') + '원' : '—'}</strong></div>
      <div><span>상태</span><strong>${statusLabel}</strong></div>
      <div><span>최근 업데이트</span><strong>${escapeHtml(item.updated_at ? fmtDate(item.updated_at) : item.presented_at || '—')}</strong></div>
    </div>
    <section class="detail-section"><h3>발표 내용</h3><p>${escapeHtml(item.topic || parseStockName(item))}</p></section>
    <section class="detail-section"><h3>핵심 투자 의견</h3><p class="${opinion ? '' : 'muted-copy'}">${escapeHtml(opinion || '아직 등록된 투자 의견이 없습니다.')}</p></section>
    <section class="detail-section"><h3>주요 리스크</h3><p class="${risk ? '' : 'muted-copy'}">${escapeHtml(risk || '등록된 리스크가 없습니다.')}</p></section>
    <section class="detail-section"><h3>투자 연결 상태</h3><p>${linkedPick ? (isInvesting ? '현재 투자 진행 중인 종목입니다.' : '투자 아이디어가 등록되어 있으며 매수 대기 중입니다.') : '아직 투자종목으로 전환되지 않았습니다.'}${targetCap ? ` 목표 시가총액 ${Number(targetCap).toLocaleString('ko-KR')}억원` : ''}</p></section>`;

  document.getElementById('presentationShareBtn').onclick = () => copyShareLink(`presentations?view=history&id=${encodeURIComponent(item.id)}`);
  const convertButton = document.getElementById('presentationConvertBtn');
  if (linkedPick?.pick_id) {
    convertButton.textContent = '투자현황 보기';
    convertButton.onclick = () => navigateToAppRoute(`picks?id=${encodeURIComponent(linkedPick.pick_id)}`);
  } else {
    convertButton.textContent = '투자종목으로 전환';
    convertButton.onclick = () => navigateToAppRoute(`picks?action=new&presentation=${encodeURIComponent(item.id)}`);
  }
}

function closePresentationDetail() {
  presentationDetailId = null;
  document.getElementById('presentationDetailModal').classList.remove('open');
  document.body.style.overflow = '';
  if (window.parent !== window && typeof window.parent.replaceRouteState === 'function') {
    const params = new URLSearchParams(location.search);
    params.delete('id'); params.delete('v');
    params.set('view', 'history');
    window.parent.replaceRouteState('presentations?' + params.toString());
  }
  presentationDetailReturnFocus?.focus?.();
}


function renderTable(data) {
  const tbody = document.getElementById('histTbody');
  document.getElementById('countLabel').textContent = `총 ${data.length}건`;

  if (!data.length) {
    tbody.innerHTML = '<tr><td colspan="10" class="empty-cell">발표 내역이 없습니다</td></tr>';
    return;
  }

  // 날짜 + 산업별로 그룹핑해서 표시
  // 같은 날짜+산업이면 시각적으로 묶기
  let lastGroupKey = null;
  let rows = '';

  data.forEach((p, i) => {
    const ret       = getReturn(p);
    const capRet    = getCapReturn(p);
    const cur       = getCurPrice(p);
    const industry  = parseIndustry(p);
    const stockName = parseStockName(p);
    // 종목 분석은 날짜별로, 산업 분석은 날짜+산업명으로 그룹핑
    const groupKey  = p.presented_at + '|' + (industry || '__stock__');
    const memberName = p.members?.name || '—';
    const avIdx     = members.findIndex(m => m.id === p.member_id) % 6;

    // 그룹 헤더 (날짜+산업이 바뀔 때)
    if (groupKey !== lastGroupKey) {
      const groupItems = data.filter(d =>
        d.presented_at === p.presented_at &&
        (parseIndustry(d) || '') === (industry || '')
      );

      // 헤더 레이블: 산업이면 산업명, 종목 분석이면 "기업 분석"
      const headerLabel = industry
        ? industry
        : '기업 분석';
      const tagClass = industry ? 'industry-tag' : 'stock-tag';

      rows += `<tr>
        <td colspan="10" style="padding:0;">
          <div class="industry-group-header">
            <div style="display:flex;align-items:center;gap:8px;">
              <span class="${tagClass}">${escapeHtml(headerLabel)}</span>
              <span style="font-size:11px;color:var(--muted);">${p.presented_at} · ${groupItems.length}종목</span>
            </div>
          </div>
        </td>
      </tr>`;
      lastGroupKey = groupKey;
    }

    // 수익률
    const retCls = ret === null ? '' : ret >= 0 ? 'up' : 'dn';
    const retStr = ret === null ? '—' : (ret >= 0 ? '+' : '') + ret.toFixed(1) + '%';
    const capRetCls = capRet === null ? '' : capRet >= 0 ? 'up' : 'dn';
    const capRetStr = capRet === null ? '—' : (capRet >= 0 ? '+' : '') + capRet.toFixed(1) + '%';

    rows += `<tr>
      <td class="muted" style="white-space:nowrap;font-size:12px;">${p.presented_at}</td>
      <td>
        <div class="flex">
          <div class="avatar ${avCls[avIdx]}" style="width:22px;height:22px;font-size:9px;">${escapeHtml(memberName.slice(0,2))}</div>
          <span style="font-size:13px;">${escapeHtml(memberName)}</span>
        </div>
      </td>
      <td>
        ${industry
          ? `<span class="industry-tag">${escapeHtml(industry)}</span>`
          : `<span class="stock-tag">기업 분석</span>`}
      </td>
      <td style="font-weight:500;">
        ${escapeHtml(stockName)}
        ${p.stock_code ? `<div style="font-size:11px;color:var(--muted);">${escapeHtml(p.stock_code)}</div>` : ''}
      </td>
      <td style="text-align:right;">
        ${p.status === 'planned'
          ? (cur?.price ? '<span style="font-size:13px;font-weight:500;">' + cur.price.toLocaleString() + '원</span>' : '<span style="color:var(--muted);font-size:12px;">—</span>')
          : (cur || p.price_at) ? `<div class="price-cell price-cell-editable" onclick="editPriceAt('${p.id}', ${p.price_at || 0}, this)"
              title="클릭하여 발표 당시 주가 입력"
              style="cursor:pointer;padding:3px 6px;border-radius:4px;display:inline-block;min-width:60px;text-align:right;">
              ${p.price_at ? p.price_at.toLocaleString() + '원' : '<span style=\"color:var(--accent);font-size:12px;\">입력</span>'}
            </div>` : '<span style="color:var(--hint);font-size:12px;">—</span>'
        }
      </td>
      <td style="text-align:right;font-weight:500;">${cur?.price ? cur.price.toLocaleString() + '원' : '—'}</td>
      <td style="text-align:right;" class="${retCls}"><strong>${retStr}</strong></td>
      <td style="text-align:right;font-size:12px;color:var(--muted);" class="hist-hide-mobile">
        ${(()=>{
          // price_at 있고 현재가·현재시총 있으면 비율로 역산
          if (p.price_at && cur?.price && cur?.market_cap) {
            const capAt = Math.round(cur.market_cap * (p.price_at / cur.price));
            return capAt.toLocaleString() + '억';
          }
          return p.market_cap_at ? p.market_cap_at.toLocaleString() + '억' : '—';
        })()}
      </td>
      <td style="text-align:right;font-size:12px;color:var(--muted);" class="hist-hide-mobile">${cur?.market_cap ? cur.market_cap.toLocaleString() + '억' : '—'}</td>
      <td style="text-align:right;" class="${capRetCls} hist-hide-mobile">${capRetStr}</td>
    </tr>`;
  });

  tbody.innerHTML = rows;
}


// ── 발표 당시가 인라인 편집
function editPriceAt(id, currentPrice, cell) {
  // 이미 편집 중이면 무시
  if (cell.querySelector('.price-edit-input')) return;

  const oldHtml = cell.innerHTML;
  cell.innerHTML = '';

  const input = document.createElement('input');
  input.type = 'number';
  input.className = 'price-edit-input';
  input.value = currentPrice || '';
  input.placeholder = '주가 입력';

  const saveBtn = document.createElement('button');
  saveBtn.textContent = '저장';
  saveBtn.style.cssText = 'font-size:11px;margin-left:4px;padding:2px 6px;cursor:pointer;border:0.5px solid var(--border2);border-radius:4px;background:var(--accent);color:#fff;';
  saveBtn.onclick = (e) => { e.stopPropagation(); savePriceAt(id, input.value, cell); };

  const cancelBtn = document.createElement('button');
  cancelBtn.textContent = '취소';
  cancelBtn.style.cssText = 'font-size:11px;margin-left:2px;padding:2px 6px;cursor:pointer;border:0.5px solid var(--border2);border-radius:4px;background:var(--surface);';
  cancelBtn.onclick = (e) => { e.stopPropagation(); cell.innerHTML = oldHtml; };

  cell.appendChild(input);
  cell.appendChild(saveBtn);
  cell.appendChild(cancelBtn);

  input.focus();
  input.select();

  // Enter 키로 저장
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter')  savePriceAt(id, input.value, cell);
    if (e.key === 'Escape') { cell.innerHTML = oldHtml; }
  });
}

async function savePriceAt(id, priceVal, cell) {
  const price = parseInt(priceVal);
  if (!price || price <= 0) { toast('올바른 주가를 입력하세요.'); return; }

  try {
    // DB 업데이트
    const { error } = await sb.from('presentations')
      .update({ price_at: price })
      .eq('id', id);
    if (error) throw error;

    // allData 업데이트
    const item = allData.find(p => p.id === id);
    if (item) item.price_at = price;

    // 셀 UI 업데이트
    const newDiv = document.createElement("div");
    newDiv.className = "price-cell";
    newDiv.title = "클릭하여 수정";
    newDiv.style.cssText = "cursor:pointer;padding:3px 6px;border-radius:4px;display:inline-block;min-width:60px;text-align:right;";
    newDiv.textContent = price.toLocaleString() + "원";
    newDiv.onclick = function() { editPriceAt(id, price, cell); };
    cell.innerHTML = "";
    cell.appendChild(newDiv);

    // 같은 행의 수익률·시총 셀 갱신
    const row = cell.closest('tr');
    if (row) updateRowStats(row, id);

    toast('저장되었습니다.');

    // 요약 카드와 산업별 카드 재계산
    const filtered = getFilteredData();
    renderSummary(filtered);
    renderIndustryCards(filtered);

  } catch(e) {
    toast('저장 오류: ' + e.message);
  }
}

function getFilteredData() {
  const member = document.getElementById('filterMember').value;
  const cat    = document.getElementById('filterCategory').value;
  return allData.filter(p => {
    const haystack = [parseStockName(p), p.stock_code, p.topic, p.members?.name]
      .filter(Boolean).join(' ').toLowerCase();
    return (p.status || 'done') === 'done' &&
      (!member || p.member_id === member) &&
      (!cat || p.category === cat) &&
      (!presentationSearchTerm || haystack.includes(presentationSearchTerm));
  });
}

// 행의 수익률·시총 셀을 재계산해서 업데이트
function updateRowStats(row, id) {
  const p   = allData.find(d => d.id === id);
  if (!p) return;
  const cur = getCurPrice(p);

  // 수익률 (6번째 td = index 5, 0-based)
  const tds = row.querySelectorAll('td');
  if (tds.length < 10) return;

  // 수익률
  let retStr = '—'; let retCls = '';
  if (p.price_at && cur?.price) {
    const ret = (cur.price - p.price_at) / p.price_at * 100;
    retCls = ret >= 0 ? 'up' : 'dn';
    retStr = '<strong>' + (ret >= 0 ? '+' : '') + ret.toFixed(1) + '%</strong>';
  }
  tds[6].className = retCls;
  tds[6].style.textAlign = 'right';
  tds[6].innerHTML = retStr;

  // 시총(발표시) — stock_prices의 shares를 모르므로 직접 입력한 price_at 기준으로
  // market_cap_at은 별도 입력이 없으면 비율로 추정
  // 현재 시총이 있으면 비율로 발표 당시 시총 추정
  if (p.price_at && cur?.price && cur?.market_cap) {
    const capAt = Math.round(cur.market_cap * (p.price_at / cur.price));
    tds[7].style.textAlign = 'right'; tds[7].style.fontSize = '12px'; tds[7].style.color = 'var(--muted)';
    tds[7].textContent = capAt.toLocaleString() + '억';
    tds[8].style.textAlign = 'right'; tds[8].style.fontSize = '12px'; tds[8].style.color = 'var(--muted)';
    tds[8].textContent = cur.market_cap.toLocaleString() + '억';

    const capRet = (cur.market_cap - capAt) / capAt * 100;
    tds[9].className = capRet >= 0 ? 'up' : 'dn';
    tds[9].style.textAlign = 'right';
    tds[9].textContent = (capRet >= 0 ? '+' : '') + capRet.toFixed(1) + '%';

    // DB에 market_cap_at도 업데이트
    sb.from('presentations').update({ market_cap_at: capAt }).eq('id', id);
    if (p) p.market_cap_at = capAt;
  }
}

document.getElementById('presentationSearch').addEventListener('input', event => {
  presentationSearchTerm = event.target.value.trim().toLowerCase();
  renderAll(getFilteredData());
});
document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && document.getElementById('presentationDetailModal').classList.contains('open')) {
    closePresentationDetail();
  }
});

init();
