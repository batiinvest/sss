<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSS · 참여자 현황</title>
  <link rel="stylesheet" href="css/style.css?v=20260811.3">
  <script>if(window!==window.parent){document.documentElement.classList.add("in-iframe");}</script>
</head>
<body>
<div class="layout layout-page"><main class="main">

  <div class="topbar member-page-topbar">
    <div>
      <div class="page-title">참여자 현황</div>
      <div class="updated">보유종목 현재가를 반영한 총자산 · 확정 종목 히스토리</div>
    </div>
    <div class="member-price-actions">
      <span id="memberPriceStatus" class="member-price-status" role="status" aria-live="polite">현재가를 불러오는 중입니다.</span>
      <button id="memberPriceRefreshBtn" class="btn" type="button" onclick="refreshMemberPrices({ announce: true })">현재가 새로고침</button>
    </div>
  </div>

  <div id="memberCards" class="member-cards-grid mb-card"></div>

</main></div>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js?v=20260811.1"></script>
<script src="js/utils/portfolio.js?v=20260811.1"></script>
<script src="js/services/price-service.js?v=20260811.1"></script>
<script src="js/db.js?v=20260811.1"></script>
<script>
let members = [];
let allTrades = [];
let allPicks = [];
let settlements = [];
let memberPriceMap = {};
let expandedId = null;

async function init() {
  await requireAuth();
  [members, allPicks, settlements, allTrades] = await Promise.all([
    fetchMembers(),
    fetchAllPicks(),
    fetchSettlements(),
    fetchAllTrades(),
  ]);
  renderMemberCards();
  await refreshMemberPrices();
}

function memberValuation(member, priceMap = memberPriceMap) {
  const initialAmount = typeof BASE_AMOUNT !== 'undefined' ? BASE_AMOUNT : 500000;
  return buildMemberPortfolioValuation(
    member,
    allPicks,
    allTrades,
    priceMap,
    initialAmount
  );
}

function getMemberPriceCodes() {
  const codes = members.flatMap(member =>
    memberValuation(member, {}).positions.map(position => position.stock_code)
  );
  return [...new Set(codes.filter(Boolean))];
}

function signedWon(value) {
  if (value === null || value === undefined) return '—';
  return `${Number(value) >= 0 ? '+' : ''}${won(value)}`;
}

function renderHoldingRows(valuation) {
  if (!valuation.positions.length) {
    return '<tr><td colspan="5" class="empty-cell">현재 보유 중인 종목이 없습니다.</td></tr>';
  }

  return valuation.positions.map(position => {
    const stockName = escapeHtml(position.stock_name || '종목명 미정');
    const stockCode = escapeHtml(position.stock_code || '종목코드 없음');
    const quantity = Number(position.quantity).toLocaleString('ko-KR', { maximumFractionDigits: 4 });
    const currentPrice = position.hasLivePrice
      ? won(position.currentPrice)
      : '<span class="member-valuation-pending">현재가 미확인</span>';
    const marketValue = position.hasLivePrice
      ? won(position.currentValue)
      : '<span class="member-valuation-pending">평가 대기</span>';
    const pnl = position.pnl === null
      ? '<span class="member-valuation-pending">평가 대기</span>'
      : `<span class="${rCls(position.pnl)}">${signedWon(position.pnl)}</span>
         <span class="member-holding-rate ${rCls(position.returnRate)}">${pct(position.returnRate)}</span>`;

    return `<tr>
      <td>
        <span class="member-holding-name">${stockName}</span>
        <span class="member-holding-meta">${stockCode}</span>
      </td>
      <td class="member-number-cell">
        <span>${quantity}주</span>
        <span class="member-holding-meta">평균 ${won(position.buyPrice)}</span>
      </td>
      <td class="member-number-cell">${currentPrice}</td>
      <td class="member-number-cell">${marketValue}</td>
      <td class="member-number-cell">${pnl}</td>
    </tr>`;
  }).join('');
}

function renderHistoryRows(picks, mySettles) {
  if (!picks.length) {
    return '<tr><td colspan="7" class="empty-cell">종목 없음</td></tr>';
  }

  return picks.map(pick => {
    const pickSettlements = mySettles.filter(item =>
      String(item.pick_id || '') === String(pick.pick_id || pick.id || '')
    );
    const settledProfit = pickSettlements.length
      ? pickSettlements.reduce((sum, item) => sum + Number(item.net_profit || 0), 0)
      : null;
    const realizedReturn = pick.realized_return;
    const month = escapeHtml((pick.month || '').replace('-', '년 '));
    const stockName = escapeHtml(pick.stock_name || '종목명 미정');
    return `<tr>
      <td class="muted">${month}${month ? '월' : '—'}</td>
      <td class="fw-500">${stockName}</td>
      <td>${pick.buy_price ? won(pick.buy_price) : '—'}</td>
      <td>${pick.sell_price ? won(pick.sell_price) : '—'}</td>
      <td class="${rCls(realizedReturn)}">${realizedReturn == null ? '—' : pct(realizedReturn)}</td>
      <td class="${rCls(settledProfit)}">${settledProfit === null ? '—' : signedWon(settledProfit)}</td>
      <td>${statusBadge(pick.status)}</td>
    </tr>`;
  }).join('');
}

function renderMemberCards() {
  const container = document.getElementById('memberCards');
  if (!members.length) {
    container.innerHTML = '<div class="card member-empty-state" role="status">표시할 참여자가 없습니다.</div>';
    return [];
  }

  const valuations = members.map(member => memberValuation(member));
  container.innerHTML = members.map((member, index) => {
    const memberId = String(member.id);
    const picks = allPicks.filter(pick => String(pick.member_id) === memberId);
    const mySettles = settlements.filter(settle => String(settle.member_id) === memberId);
    const valuation = valuations[index];
    const initialAmount = valuation.initialAmount;
    const hasCompletePricing = valuation.hasCompletePricing;
    const isExpanded = expandedId === memberId;
    const historyId = `member-history-${index}`;
    const toggleId = `member-history-toggle-${index}`;
    const cardId = `member-card-${index}`;
    const titleId = `member-name-${index}`;
    const missingPriceCount = valuation.holdingCount - valuation.priceMatchedCount;
    const pricingLabel = valuation.holdingCount === 0
      ? '보유종목 없음'
      : hasCompletePricing
        ? `현재가 ${valuation.priceMatchedCount}/${valuation.holdingCount}`
        : `현재가 미확인 ${missingPriceCount}건`;
    const totalAssetText = hasCompletePricing ? won(valuation.totalAsset) : '평가 대기';
    const comparisonText = hasCompletePricing
      ? `${signedWon(valuation.totalProfit)} (${pct(valuation.totalReturnRate)})`
      : '현재가 확인 후 계산됩니다.';
    const marketValueText = hasCompletePricing ? won(valuation.totalMarketValue) : '평가 대기';
    const pnlText = hasCompletePricing ? signedWon(valuation.unrealizedPnl) : '평가 대기';
    const returnRate = hasCompletePricing ? valuation.totalReturnRate : null;
    const barWidth = returnRate === null ? 0 : Math.min(Math.abs(returnRate) * 4, 100);
    const barClass = returnRate === null ? '' : (returnRate >= 0 ? 'bar-up' : 'bar-dn');
    const bestPick = mySettles.reduce((best, settle) =>
      settle.return_rate > (best?.return_rate ?? -Infinity) ? settle : best, null
    );
    const winCount = mySettles.filter(settle => settle.net_profit > 0).length;
    const winRate = mySettles.length ? Math.round(winCount / mySettles.length * 100) : null;
    const bestPickText = bestPick
      ? `<div class="member-best-pick">최고 확정 수익: <strong>${escapeHtml(bestPick.picks?.stock_name || '—')}</strong> <span class="${rCls(bestPick.return_rate)}">${pct(bestPick.return_rate)}</span></div>`
      : '';

    return `<article id="${cardId}" class="card member-card" data-member-card-id="${escapeHtml(memberId)}" aria-labelledby="${titleId}">
      <div class="member-card-header">
        <div class="member-identity">
          <div class="avatar ${avCls[index % 6]} member-avatar">${escapeHtml(String(member.name || '').slice(0, 2))}</div>
          <div>
            <h2 id="${titleId}" class="member-name">${escapeHtml(member.name)}</h2>
            <div class="member-joined">참여일 ${escapeHtml(member.joined_at || '—')}</div>
          </div>
        </div>
        <div class="member-asset-summary">
          <span class="member-asset-label">현재 총자산</span>
          <strong class="member-asset-value ${rCls(returnRate)}">${totalAssetText}</strong>
          <span class="member-asset-comparison ${rCls(valuation.totalProfit)}">최초 ${won(initialAmount)} 대비 ${comparisonText}</span>
          <span class="member-price-chip ${hasCompletePricing ? '' : 'is-pending'}">${pricingLabel}</span>
        </div>
      </div>

      <div class="member-return-track" aria-hidden="true">
        <div class="prog-bar ${barClass}" style="width:${barWidth}%;"></div>
      </div>

      <div class="member-stat-grid">
        <div class="member-stat">
          <span>기준금액</span>
          <strong>${won(valuation.baseAmount)}</strong>
        </div>
        <div class="member-stat">
          <span>투자원금</span>
          <strong>${won(valuation.totalCost)}</strong>
        </div>
        <div class="member-stat">
          <span>현금</span>
          <strong class="${rCls(valuation.cash)}">${won(valuation.cash)}</strong>
        </div>
        <div class="member-stat">
          <span>보유종목 평가금액</span>
          <strong>${marketValueText}</strong>
        </div>
        <div class="member-stat">
          <span>평가손익</span>
          <strong class="${rCls(valuation.unrealizedPnl)}">${pnlText}</strong>
        </div>
        <div class="member-stat">
          <span>확정 승률</span>
          <strong>${winRate === null ? '—' : `${winRate}%`}</strong>
        </div>
      </div>

      <section class="member-holdings-section" aria-labelledby="member-holdings-title-${index}">
        <div class="member-section-head">
          <h3 id="member-holdings-title-${index}">현재 보유종목</h3>
          <span>${valuation.holdingCount}건</span>
        </div>
        <div class="member-table-scroll" role="region" aria-label="${escapeHtml(member.name || '참여자')}님의 현재 보유종목" tabindex="0">
          <table class="member-holdings-table">
            <caption class="sr-only">현재 보유종목의 수량, 평균매수가, 현재가, 평가금액과 평가손익</caption>
            <thead><tr>
              <th scope="col">종목</th>
              <th scope="col">보유수량</th>
              <th scope="col">현재가</th>
              <th scope="col">평가금액</th>
              <th scope="col">평가손익</th>
            </tr></thead>
            <tbody>${renderHoldingRows(valuation)}</tbody>
          </table>
        </div>
      </section>

      ${bestPickText}

      <div id="${historyId}" class="hist-wrap" ${isExpanded ? '' : 'hidden'}>
        <div class="member-section-head">
          <h3>종목 히스토리</h3>
          <span>${picks.length}건</span>
        </div>
        <div class="member-table-scroll" role="region" aria-label="${escapeHtml(member.name || '참여자')}님의 종목 히스토리" tabindex="0">
          <table class="member-history-table">
            <caption class="sr-only">종목별 매수가, 매도가, 수익률과 확정 손익 히스토리</caption>
            <thead><tr>
              <th scope="col">월</th><th scope="col">종목</th><th scope="col">매수가</th><th scope="col">매도가</th><th scope="col">수익률</th><th scope="col">확정 손익</th><th scope="col">상태</th>
            </tr></thead>
            <tbody>${renderHistoryRows(picks, mySettles)}</tbody>
          </table>
        </div>
      </div>

      <button id="${toggleId}" class="member-history-toggle" type="button" aria-expanded="${isExpanded}" aria-controls="${historyId}" data-member-id="${escapeHtml(memberId)}" onclick="toggleHistory(this.dataset.memberId)">
        ${isExpanded ? '▲ 종목 히스토리 접기' : '▼ 종목 히스토리 보기'}
      </button>
    </article>`;
  }).join('');

  return valuations;
}

async function refreshMemberPrices(options = {}) {
  const status = document.getElementById('memberPriceStatus');
  const button = document.getElementById('memberPriceRefreshBtn');
  const announce = options.announce === true;
  const codes = getMemberPriceCodes();

  button.disabled = true;
  button.textContent = '조회 중…';
  status.textContent = codes.length ? '현재가 조회 중…' : '현재가 조회 대상이 없습니다.';

  try {
    memberPriceMap = codes.length ? await fetchPriceMapByCodes(codes) : {};
    const valuations = renderMemberCards();
    const holdingCount = valuations.reduce((sum, valuation) => sum + valuation.holdingCount, 0);
    const matchedCount = valuations.reduce((sum, valuation) => sum + valuation.priceMatchedCount, 0);
    const time = new Date();
    const timeLabel = `${time.getHours()}:${String(time.getMinutes()).padStart(2, '0')}`;
    status.textContent = holdingCount
      ? `현재가 ${matchedCount}/${holdingCount} · ${timeLabel} 조회`
      : '현재 보유종목이 없습니다.';
    if (announce) {
      toast(holdingCount === 0
        ? '현재 보유종목이 없습니다.'
        : matchedCount === holdingCount
          ? '저장된 최신 현재가를 불러왔습니다.'
          : '일부 종목의 현재가를 확인하지 못했습니다.');
    }
  } catch (error) {
    console.error('참여자 현재가 조회 오류:', error);
    status.textContent = '현재가를 불러오지 못했습니다. 다시 시도해 주세요.';
    if (announce) toast('현재가를 불러오지 못했습니다.');
  } finally {
    button.disabled = false;
    button.textContent = '현재가 새로고침';
  }
}

function toggleHistory(memberId) {
  expandedId = expandedId === String(memberId) ? null : String(memberId);
  renderMemberCards();

  const index = members.findIndex(member => String(member.id) === String(memberId));
  if (index < 0) return;
  const button = document.getElementById(`member-history-toggle-${index}`);
  button?.focus({ preventScroll: true });
  if (expandedId) {
    document.getElementById(`member-card-${index}`)?.scrollIntoView({
      behavior: 'smooth',
      block: 'nearest',
    });
  }
}

init();
</script>
</body>
</html>
