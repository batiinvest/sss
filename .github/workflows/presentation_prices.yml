name: Presentation daily closes

on:
  schedule:
    # KST 18:20, 22:20, 06:20. Retry late completions and provider failures.
    - cron: '20 9,13,21 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/presentation-prices.cjs
      - .github/workflows/presentation_prices.yml

permissions:
  contents: read

concurrency:
  group: presentation-daily-closes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/presentation-prices.test.cjs
      - run: node scripts/presentation-prices.cjs --apply
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
