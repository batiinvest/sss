<script>
// ← 공통 변수는 js/schedule-shared.js 참조

let selectedCalendarDate = null;
let formReturnFocus = null;
let detailReturnFocus = null;
let formInitialState = '';
let formLegacyPresentationPrefix = '';
let presOrder = [];

function refreshSchedulePageViews() {
  renderCalendar();
  renderUpcoming();
  renderScheduleList();
  if (selectedCalendarDate) showDayPanel(selectedCalendarDate);
}

function formatScheduleDate(dateString) {
  const date = new Date(dateString + 'T00:00:00');
  return `${date.getMonth() + 1}월 ${date.getDate()}일 ${['일', '월', '화', '수', '목', '금', '토'][date.getDay()]}요일`;
}


function getScheduleShareUrl(scheduleId) {
  if (window.APP_PUBLIC_URL) {
    const configured = window.APP_PUBLIC_URL.replace(/\/$/, '');
    const appUrl = /\.html$/i.test(configured) ? configured : configured + '/app.html';
    return `${appUrl}#schedule-calendar?schedule=${encodeURIComponent(scheduleId || '')}`;
  }
  const origin = window.parent && window.parent !== window ? window.parent.location.origin : window.location.origin;
  const rawPath = window.parent && window.parent !== window ? window.parent.location.pathname : window.location.pathname;
  const path = rawPath.replace(/[^/]*$/, 'app.html');
  const isLocalFile = !origin || origin === 'null' || window.location.protocol === 'file:';
  if (isLocalFile) return 'https://github.com/batiinvest/sss';
  return `${origin}${path}#schedule-calendar?schedule=${encodeURIComponent(scheduleId || '')}`;
}

function getSchedulePresentations(scheduleId, date) {
  const schedule = schedules.find(item => String(item.id) === String(scheduleId));
  if (!schedule) return [];
  const orderedMembers = normalizePresentationOrder(members, presOrder);
  const plan = buildPresentationSchedulePlan(
    schedules,
    presentations,
    orderedMembers,
    { fromDate: toDateStr(new Date()) }
  );
  return getEffectiveScheduleRoster(
    schedule,
    schedules,
    presentations,
    orderedMembers,
    plan
  ).filter(p => p.status === 'planned' || p.status === 'done');
}

async function reconcileAutomaticPresentationAssignments(fromDate = toDateStr(new Date())) {
  const orderedMembers = normalizePresentationOrder(members, presOrder);
  const result = await syncPlannedPresentationsToSchedulePlan(
    sb,
    schedules,
    presentations,
    orderedMembers,
    { fromDate }
  );
  if (result.patches.length) {
    presentations = await reloadPresentations();
  }
  return result.patches.length;
}

function buildScheduleShareText(s) {
  const parts = [];
  parts.push(`${s.event_date}${s.event_time ? ' ' + s.event_time.slice(0, 5) : ''}`);
  if (s.location) parts.push(s.location);
  parts.push(CAT_LABEL[s.category] || '일정');

  const pres = getSchedulePresentations(s.id, s.event_date);
  const presText = pres.length
    ? '\n\n발표 순서\n' + pres.map((p, i) => {
        const name = p.members?.name || '발표자';
        const topic = p.topic?.includes('>') ? p.topic.split('>')[1].trim() : (p.topic || '종목 미입력');
        return `${i + 1}. ${name} - ${topic}`;
      }).join('\n')
    : '';

  return `${parts.join(' · ')}${presText}`;
}

function ensureKakaoShareReady() {
  const key = window.KAKAO_JS_KEY;
  if (!key) {
    toast('Kakao JavaScript 키를 js/config.js에 설정하면 공유할 수 있습니다.');
    return false;
  }
  if (!window.Kakao || !Kakao.Share) {
    toast('카카오 공유 SDK를 불러오지 못했습니다.');
    return false;
  }
  if (!Kakao.isInitialized()) Kakao.init(key);
  return true;
}

function shareScheduleToKakao(scheduleId, e) {
  if (e) e.stopPropagation();
  const s = schedules.find(item => item.id === scheduleId);
  if (!s || !ensureKakaoShareReady()) return;

  const url = getScheduleShareUrl(scheduleId);
  Kakao.Share.sendDefault({
    objectType: 'text',
    text: `[SSS 스터디 일정]\n${s.title}\n${buildScheduleShareText(s)}`,
    link: {
      mobileWebUrl: url,
      webUrl: url,
    },
    buttonTitle: '일정 보기',
  });
}
async function init() {
  await requireAuth();
  checkDBConnection();
  _loadCalState();   // 발표순서에서 이동한 달 상태 복원

  try {
    await loadSharedData();   // js/schedule-shared.js
    const savedOrder = await getConfig('pres_order');
    presOrder = normalizePresentationOrder(members, savedOrder).map(member => member.id);
  } catch(e) {
    console.error('일정 데이터 로드 오류:', e.message);
    schedules = []; members = []; presentations = [];
  }

  const sel = document.getElementById('s-member');
  if (sel) members.forEach(m => sel.innerHTML += `<option value="${m.id}">${m.name}</option>`);

  renderCalendar();
  renderUpcoming();
  renderScheduleList();

  const routeParams = new URLSearchParams(location.search);
  const sharedScheduleId = routeParams.get('schedule');
  if (sharedScheduleId) {
    setTimeout(() => showDetail(sharedScheduleId), 0);
  } else if (routeParams.get('action') === 'new') {
    setTimeout(() => openForm({ event_date: routeParams.get('date') || '' }), 0);
    if (window.parent && typeof window.parent.replaceRouteState === 'function') {
      window.parent.replaceRouteState('schedule-calendar');
    }
  }
}

// ── 달력 렌더링
function renderCalendar() {
  document.getElementById('calTitle').textContent = `${calYear}년 ${MONTH_KR[calMonth]}`;
  const grid = document.getElementById('calGrid');
  // 헤더 7개는 유지
  const headers = Array.from(grid.children).slice(0, 7);
  grid.innerHTML = '';
  headers.forEach(h => grid.appendChild(h));

  const today   = new Date();
  const first   = new Date(calYear, calMonth, 1);
  const last    = new Date(calYear, calMonth+1, 0);
  const startDay= first.getDay();

  // 이전 달 빈 칸
  for (let i = 0; i < startDay; i++) {
    const prevDate = new Date(calYear, calMonth, -startDay + i + 1);
    grid.appendChild(makeDay(prevDate, true));
  }
  // 이번 달
  for (let d = 1; d <= last.getDate(); d++) {
    const date  = new Date(calYear, calMonth, d);
    const isToday = date.toDateString() === today.toDateString();
    grid.appendChild(makeDay(date, false, isToday));
  }
  // 다음 달 빈 칸
  const remaining = 7 - ((startDay + last.getDate()) % 7);
  if (remaining < 7) {
    for (let d = 1; d <= remaining; d++) {
      grid.appendChild(makeDay(new Date(calYear, calMonth+1, d), true));
    }
  }
}

function makeDay(date, otherMonth, isToday=false) {
  const cell = document.createElement('div');
  cell.className = 'cal-day' + (otherMonth?' other-month':'') + (isToday?' today':'');
  const dateStr = toDateStr(date);
  const dayEvents = schedules.filter(s => s.event_date === dateStr);
  cell.dataset.date = dateStr;
  cell.tabIndex = 0;
  cell.setAttribute('role', 'button');
  cell.setAttribute('aria-label', `${formatScheduleDate(dateStr)}, 일정 ${dayEvents.length}건. 선택해서 일정 확인 또는 추가`);
  cell.addEventListener('click', (e) => {
    if (e.target.closest('button')) return;
    showDayPanel(dateStr, { reveal: true });
  });
  cell.addEventListener('keydown', (e) => {
    if (e.target !== cell) return;
    if (e.key !== 'Enter' && e.key !== ' ') return;
    e.preventDefault();
    showDayPanel(dateStr, { reveal: true });
  });
  cell.title = '선택: 일정 확인 또는 추가';

  const numDiv = document.createElement('div');
  numDiv.className = 'cal-day-num';
  numDiv.textContent = date.getDate();
  cell.appendChild(numDiv);

  if (dayEvents.length) {
    const count = document.createElement('span');
    count.className = 'cal-day-count';
    count.textContent = dayEvents.length + '건';
    cell.appendChild(count);
  }

  dayEvents.slice(0,3).forEach(ev => {
    const evDiv = document.createElement('div');
    evDiv.className = 'cal-event ' + (CAT_CLASS[ev.category]||'ev-other');
    evDiv.textContent = ev.title;
    evDiv.title = `${ev.title} 상세 보기`;
    evDiv.addEventListener('click', e => { e.stopPropagation(); showDetail(ev.id, e); });
    cell.appendChild(evDiv);

    // 발표자+종목 표시 (산업/기업 분석 일정만)
    if (ev.category === 'stock' || ev.category === 'industry') {
      const pres = getSchedulePresentations(ev.id, dateStr);
      pres.forEach(p => {
        const pDiv = document.createElement('div');
        pDiv.className = 'cal-presenter-line';
        const name  = p.members?.name?.slice(0,2) || '';
        const topic = p.topic?.includes('>') ? p.topic.split('>')[1].trim() : (p.topic || '종목 미입력');
        pDiv.textContent = name + ' · ' + topic;
        cell.appendChild(pDiv);
      });
    }
  });

  if (dayEvents.length > 3) {
    const more = document.createElement('div');
    more.className = 'cal-more';
    more.textContent = '+' + (dayEvents.length-3) + '개';
    more.title = `${formatScheduleDate(dateStr)} 일정 모두 보기`;
    more.addEventListener('click', e => { e.stopPropagation(); showDayPanel(dateStr, { reveal: true }); });
    cell.appendChild(more);
  }

  return cell;
}

function showDayPanel(dateStr, { reveal = false } = {}) {
  selectedCalendarDate = dateStr;
  document.querySelectorAll('.cal-day').forEach(cell => {
    cell.classList.toggle('selected', cell.dataset.date === dateStr);
  });

  const panel = document.getElementById('selectedDayPanel');
  const dayEvents = schedules
    .filter(schedule => schedule.event_date === dateStr)
    .sort((a, b) => String(a.event_time || '').localeCompare(String(b.event_time || '')));
  panel.hidden = false;
  panel.innerHTML = `
    <div class="selected-day-head">
      <strong>${escapeHtml(formatScheduleDate(dateStr))}</strong>
      <button type="button" class="btn btn-primary" onclick="openForm({event_date:'${dateStr}'})">+ 이 날 일정</button>
    </div>
    <div class="selected-day-list">
      ${dayEvents.length ? dayEvents.map(schedule => `
        <button type="button" class="selected-day-event" onclick="showDetail('${schedule.id}',event)">
          <span class="ev-badge ${CAT_CLASS[schedule.category] || 'ev-other'}">${escapeHtml(CAT_LABEL[schedule.category] || '기타')}</span>
          <strong>${escapeHtml(schedule.title)}</strong>
          <small>${escapeHtml(schedule.event_time ? schedule.event_time.slice(0, 5) : '시간 미정')}</small>
        </button>`).join('') : '<div class="selected-day-empty">등록된 일정이 없습니다. 위 버튼으로 바로 추가할 수 있습니다.</div>'}
    </div>`;

  if (reveal && window.matchMedia?.('(max-width: 768px)').matches) {
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    requestAnimationFrame(() => panel.scrollIntoView({
      behavior: reduceMotion ? 'auto' : 'smooth',
      block: 'center',
    }));
  }
}

function clearSelectedDay() {
  selectedCalendarDate = null;
  document.getElementById('selectedDayPanel').hidden = true;
}

// ── 달력 탐색 (sessionStorage로 두 페이지 간 월 상태 공유)
function _saveCalState() {
  try { sessionStorage.setItem('sss_cal', JSON.stringify({y:calYear, m:calMonth})); } catch(e){}
}
function _loadCalState() {
  try {
    const s = sessionStorage.getItem('sss_cal');
    if (s) { const d = JSON.parse(s); calYear = d.y; calMonth = d.m; }
  } catch(e){}
}
function prevMonth() { calMonth--; if(calMonth<0){calMonth=11;calYear--;} clearSelectedDay(); renderCalendar(); _saveCalState(); }
function nextMonth() { calMonth++; if(calMonth>11){calMonth=0;calYear++;} clearSelectedDay(); renderCalendar(); _saveCalState(); }
function goToday()   { const t=new Date(); calYear=t.getFullYear(); calMonth=t.getMonth(); renderCalendar(); showDayPanel(toDateStr(t), { reveal: true }); _saveCalState(); }

// ── 다가오는 일정
function renderUpcoming() {
  const today = toDateStr(new Date());
  const todayDate = new Date(today + 'T00:00:00');
  const upcoming = schedules
    .filter(s => s.event_date >= today)
    .sort((a,b) => a.event_date.localeCompare(b.event_date))
    .slice(0, 5);

  const el = document.getElementById('upcomingList');
  if (!upcoming.length) {
    el.innerHTML = `<div class="mobile-empty-state">
      <strong>예정된 일정이 없습니다.</strong>
      <span>날짜를 선택하거나 새 일정을 등록해 다음 스터디를 준비하세요.</span>
      <button type="button" class="btn btn-primary" onclick="openForm()">+ 다음 일정 등록</button>
    </div>`;
    return;
  }

  el.innerHTML = upcoming.map(s => {
    const d     = new Date(s.event_date + 'T00:00:00');
    const mon   = MONTH_KR[d.getMonth()];
    const day   = d.getDate();
    const dow   = ['일','월','화','수','목','금','토'][d.getDay()];
    const dDiff = Math.round((d - todayDate) / 86400000);
    const dStr  = dDiff === 0 ? '오늘' : dDiff === 1 ? '내일' : `D-${dDiff}`;

    // 이 일정의 발표자·종목 목록
    const pres = getSchedulePresentations(s.id, s.event_date).filter(p => p.status === 'planned');

    const presHtml = pres.length
      ? `<div class="upcoming-presenters">
          ${pres.map((p, i) => {
            const name  = p.members?.name || '—';
            const topic = p.topic?.includes('>') ? p.topic.split('>')[1].trim() : (p.topic||'—');
            return `<div class="upcoming-presenter">
              <span>${i+1}.</span>
              <strong>${escapeHtml(name)}</strong>
              <span>${escapeHtml(topic)}</span>
            </div>`;
          }).join('')}
        </div>`
      : `<div class="upcoming-meta">발표자·종목 미등록</div>`;

    return `<article class="upcoming-item">
      <div class="upcoming-content">
        <div class="upcoming-date">
          <div class="upcoming-month">${mon}</div>
          <div class="upcoming-day">${day}</div>
          <div style="font-size:10px;color:var(--muted);">${dow}요일</div>
        </div>
        <div class="upcoming-copy">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">
            <span class="ev-badge ${CAT_CLASS[s.category]||'ev-other'}">${escapeHtml(CAT_LABEL[s.category]||'기타')}</span>
            <span style="font-size:11px;color:${dDiff<=3?'#a32d2d':'var(--muted)'};">${dStr}</span>
          </div>
          <div class="upcoming-title">${escapeHtml(s.title)}</div>
          <div class="upcoming-meta">${escapeHtml(s.event_time ? s.event_time.slice(0,5) : '시간 미정')}${s.location ? ' · ' + escapeHtml(s.location) : ''}</div>
          ${(s.category === 'stock' || s.category === 'industry') ? presHtml : ''}
        </div>
      </div>
      <div class="upcoming-actions">
        <button type="button" class="btn btn-primary" onclick="showDetail('${s.id}',event)">상세 보기</button>
        <button type="button" class="btn schedule-kakao-button" onclick="shareScheduleToKakao('${s.id}',event)">공유</button>
      </div>
    </article>`;
  }).join('');
}

// ── 전체 목록
function renderScheduleList() {
  const cat = document.getElementById('filterCat').value;
  const when = document.getElementById('filterWhen').value;
  const query = document.getElementById('filterQuery').value.trim().toLowerCase();
  const today = toDateStr(new Date());
  const list = schedules.filter(s => {
    if (cat && s.category !== cat) return false;
    if (when === 'upcoming' && s.event_date < today) return false;
    if (when === 'past' && s.event_date >= today) return false;
    if (!query) return true;
    const presText = getSchedulePresentations(s.id, s.event_date)
      .map(p => `${p.members?.name || ''} ${p.topic || ''}`).join(' ');
    return [s.title, s.location, s.description, presText]
      .filter(Boolean).join(' ').toLowerCase().includes(query);
  }).sort((a,b) => when === 'upcoming'
    ? a.event_date.localeCompare(b.event_date)
    : b.event_date.localeCompare(a.event_date));
  const tbody = document.getElementById('scheduleListTbody');
  const mobileList = document.getElementById('scheduleMobileList');
  if (!list.length) {
    tbody.innerHTML = '<tr><td colspan="7" class="muted" style="text-align:center;padding:1.5rem;">조건에 맞는 일정이 없습니다</td></tr>';
    mobileList.innerHTML = '<div class="mobile-empty-state"><strong>조건에 맞는 일정이 없습니다.</strong><span>검색어나 필터를 바꿔보세요.</span></div>';
    return;
  }
  tbody.innerHTML = list.map(s => {
    const past = s.event_date < today;
    const memo = extractScheduleMemo(s.description);
    return `<tr style="${past?'opacity:0.55;':''}">
      <td style="white-space:nowrap;">${escapeHtml(s.event_date)}</td>
      <td style="font-weight:500;">${escapeHtml(s.title)}</td>
      <td><span class="ev-badge ${CAT_CLASS[s.category]||'ev-other'}">${escapeHtml(CAT_LABEL[s.category]||'기타')}</span></td>
      <td class="muted">${escapeHtml(s.event_time ? s.event_time.slice(0,5) : '-')}</td>
      <td class="muted">${escapeHtml(s.location||'-')}</td>
      <td class="muted" style="font-size:12px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(memo || '-')}</td>
      <td>
        <div style="display:flex;gap:4px;flex-wrap:wrap;">
          <button type="button" class="btn schedule-kakao-button" onclick="shareScheduleToKakao('${s.id}',event)">공유</button>
          <button type="button" class="btn" onclick="editSchedule('${s.id}')">수정</button>
          <button type="button" class="btn" style="color:var(--up);border-color:var(--up);" onclick="confirmDelete('${s.id}')">삭제</button>
        </div>
      </td>
    </tr>`;
  }).join('');

  mobileList.innerHTML = list.map(s => {
    const pres = ['industry', 'stock'].includes(s.category)
      ? getSchedulePresentations(s.id, s.event_date)
      : [];
    const presHtml = pres.length ? pres.map((p, index) => {
      const topic = p.topic?.includes('>') ? p.topic.split('>').pop().trim() : (p.topic || '종목 미정');
      return `${index + 1}. ${escapeHtml(p.members?.name || '발표자 미정')} · ${escapeHtml(topic)}`;
    }).join('<br>') : '';
    return `<article class="schedule-mobile-card">
      <div class="schedule-mobile-card-head">
        <div>
          <div class="schedule-mobile-card-date">${escapeHtml(formatScheduleDate(s.event_date))}</div>
          <h3>${escapeHtml(s.title)}</h3>
        </div>
        <span class="ev-badge ${CAT_CLASS[s.category]||'ev-other'}">${escapeHtml(CAT_LABEL[s.category]||'기타')}</span>
      </div>
      <div class="schedule-mobile-card-meta">${escapeHtml(s.event_time ? s.event_time.slice(0,5) : '시간 미정')}${s.location ? ' · ' + escapeHtml(s.location) : ''}</div>
      ${presHtml ? `<div class="schedule-mobile-card-pres">${presHtml}</div>` : ''}
      <div class="schedule-mobile-card-actions">
        <button type="button" class="btn btn-primary" onclick="showDetail('${s.id}',event)">상세 보기</button>
        <button type="button" class="btn schedule-kakao-button" onclick="shareScheduleToKakao('${s.id}',event)">공유</button>
        <button type="button" class="btn" onclick="editSchedule('${s.id}')">수정</button>
      </div>
    </article>`;
  }).join('');
}

// ── 폼
function splitScheduleDescription(description) {
  let text = String(description || '').replace(/\r/g, '').trim();
  const presentationBlocks = [];
  while (text) {
    const lines = text.split('\n');
    if (!/^[《【].+[》】]$/.test((lines[0] || '').trim())) break;
    let index = 1;
    let foundPresentation = false;
    while (index < lines.length && /^\d+\.\s+.+\s+[—-]\s+.+$/.test(lines[index].trim())) {
      foundPresentation = true;
      index += 1;
    }
    if (!foundPresentation) break;
    presentationBlocks.push(lines.slice(0, index).join('\n').trim());
    while (index < lines.length && !lines[index].trim()) index += 1;
    text = lines.slice(index).join('\n').trim();
  }
  return {
    presentationPrefix: presentationBlocks.join('\n\n'),
    memo: text,
  };
}

function extractScheduleMemo(description) {
  return splitScheduleDescription(description).memo;
}

function showScheduleFormError(message, field) {
  const error = document.getElementById('scheduleFormError');
  error.textContent = message || '';
  document.querySelectorAll('#scheduleForm [aria-invalid="true"]').forEach(input => input.removeAttribute('aria-invalid'));
  if (field) {
    field.setAttribute('aria-invalid', 'true');
    field.focus();
  }
}

function getScheduleFormState() {
  return JSON.stringify(Array.from(
    document.querySelectorAll('#scheduleFormElement input, #scheduleFormElement select, #scheduleFormElement textarea')
  ).map(field => [field.id || field.className, field.value, field.dataset.presentationId || '']));
}

function isScheduleFormDirty() {
  return Boolean(formInitialState) && getScheduleFormState() !== formInitialState;
}

function openForm(prefill={}) {
  formReturnFocus = document.activeElement;
  editingScheduleId = prefill.id || null;
  document.getElementById('formTitle').textContent = editingScheduleId ? '일정 수정' : '일정 추가';
  showScheduleFormError('');
  document.getElementById('s-title').value    = prefill.title       || '';
  const catVal = prefill.category || 'industry';
  document.getElementById('s-category').value = catVal;
  document.getElementById('s-date').value     = prefill.event_date  || '';
  document.getElementById('s-time').value     = prefill.event_time
    ? prefill.event_time.slice(0,5)
    : (editingScheduleId ? '' : '20:00');
  document.getElementById('s-location').value = prefill.location    || '';
  document.getElementById('s-member').value   = prefill.created_by  || '';
  const descriptionParts = splitScheduleDescription(prefill.description);
  const hasStoredTopics = prefill.id && getLinkedSchedulePresentations(
    prefill,
    schedules,
    presentations
  ).some(presentation => presentation.topic);
  formLegacyPresentationPrefix = hasStoredTopics
    ? ''
    : descriptionParts.presentationPrefix;
  document.getElementById('s-desc').value = descriptionParts.memo;

  formInitialState = getScheduleFormState();

  const modal = document.getElementById('scheduleForm');
  modal.hidden = false;
  requestAnimationFrame(() => modal.classList.add('open'));
  document.body.classList.add('sheet-open');
  setTimeout(() => document.getElementById('s-title').focus(), 0);
}

function closeForm(force = false) {
  if (!force && isScheduleFormDirty() && !confirm('작성 중인 내용이 있습니다. 입력을 취소할까요?')) return false;
  editingScheduleId = null;
  formInitialState = '';
  formLegacyPresentationPrefix = '';
  const modal = document.getElementById('scheduleForm');
  modal.classList.remove('open');
  modal.hidden = true;
  if (!document.getElementById('detailModal').classList.contains('open')) document.body.classList.remove('sheet-open');
  formReturnFocus?.focus?.();
  return true;
}

function editSchedule(id) {
  const s = schedules.find(s => s.id === id);
  if (s) openForm(s);
}

async function saveSchedule(event) {
  event?.preventDefault?.();
  const title    = document.getElementById('s-title').value.trim();
  const category = document.getElementById('s-category').value;
  const date     = document.getElementById('s-date').value;
  const time     = document.getElementById('s-time').value || null;
  const location = document.getElementById('s-location').value.trim() || null;
  const memberId = document.getElementById('s-member').value || null;
  const memo     = document.getElementById('s-desc').value.trim();
  const desc     = [formLegacyPresentationPrefix, memo].filter(Boolean).join('\n\n') || null;
  const previousCategory = editingScheduleId
    ? schedules.find(schedule => String(schedule.id) === String(editingScheduleId))?.category
    : null;

  showScheduleFormError('');

  if (!title) {
    showScheduleFormError('일정 제목을 입력하세요.', document.getElementById('s-title'));
    return;
  }
  if (!date) {
    showScheduleFormError('일정 날짜를 선택하세요.', document.getElementById('s-date'));
    return;
  }

  const btn = document.getElementById('saveScheduleBtn');
  btn.textContent = '저장 중...'; btn.disabled = true;

  try {
    const payload = { title, category, event_date: date, event_time: time, location, created_by: memberId, description: desc };
    let savedSchedule = null;
    const wasEditing = Boolean(editingScheduleId);
    if (editingScheduleId) {
      await updateSchedule(editingScheduleId, payload);
    } else {
      savedSchedule = await submitSchedule(payload);
      // 발표 저장이 실패해도 재시도 시 같은 일정을 수정하도록 새 ID를 즉시 보존한다.
      editingScheduleId = savedSchedule?.id || null;
      if (!editingScheduleId) throw new Error('저장된 일정 ID를 확인하지 못했습니다.');
    }

    if (
      editingScheduleId &&
      previousCategory &&
      previousCategory !== category &&
      ['industry', 'stock'].includes(category)
    ) {
      const linkedPlanned = presentations.filter(presentation =>
        String(presentation.schedule_id || '') === String(editingScheduleId) &&
        presentation.status === 'planned'
      );
      const results = await Promise.all(linkedPlanned.map(presentation => {
        const topic = category === 'stock' && presentation.topic?.includes('>')
          ? presentation.topic.split('>').pop().trim()
          : presentation.topic;
        return sb.from('presentations')
          .update({ category, topic })
          .eq('id', presentation.id);
      }));
      const failed = results.find(result => result.error);
      if (failed?.error) throw failed.error;
    }

    if (!['industry', 'stock'].includes(category) && editingScheduleId) {
      // 발표 일정에서 회식·기타로 바뀌면 작성 중인 발표만 연결 해제한다.
      // 완료 기록은 이력 보존을 위해 수정하지 않는다.
      const linkedPlannedIds = presentations
        .filter(p => p.schedule_id === editingScheduleId && p.status === 'planned')
        .map(p => p.id);
      if (linkedPlannedIds.length) {
        const { error } = await sb.from('presentations')
          .update({ schedule_id: null, presented_at: null })
          .in('id', linkedPlannedIds);
        if (error) throw error;
      }
    }

    // 발표 목록과 일정 목록을 함께 갱신해 모든 화면의 연결 상태를 맞춘다.
    presentations = await sb.from('presentations')
      .select('*, members(name)').order('created_at').then(r => r.data || []);
    schedules = await fetchSchedules();
    const today = toDateStr(new Date());
    await reconcileAutomaticPresentationAssignments(today);
    refreshSchedulePageViews();
    toast(wasEditing
      ? '일정과 발표 순서가 자동으로 조정되었습니다.'
      : '일정이 추가되고 발표 순서가 자동 반영되었습니다!');
    closeForm(true);
  } catch(e) {
    showScheduleFormError('저장하지 못했습니다. ' + (e.message || '잠시 후 다시 시도하세요.'));
    toast('오류: ' + e.message);
  }
  finally { btn.textContent = '일정 저장'; btn.disabled = false; }
}

async function confirmDelete(id) {
  const s = schedules.find(s => s.id === id);
  if (!s || !confirm(`"${s.title}" 일정을 삭제할까요?`)) return;
  const { data: linkedRowsData, error: linkedRowsError } = await sb
    .from('presentations')
    .select('id,status,presented_at')
    .eq('schedule_id', id);
  if (linkedRowsError) {
    toast('연결된 발표를 확인하지 못해 일정을 삭제하지 않았습니다: ' + linkedRowsError.message);
    return;
  }
  const linkedRows = linkedRowsData || [];
  const plannedIds = linkedRows
    .filter(p => p.status === 'planned')
    .map(p => p.id);
  const historyIds = linkedRows
    .filter(p => p.status !== 'planned')
    .map(p => p.id);
  let plannedDetached = false;
  let historyDetached = false;
  let scheduleDeleted = false;
  let rollbackFailed = false;
  try {
    if (plannedIds.length) {
      const { error } = await sb.from('presentations')
        .update({ schedule_id: null, presented_at: null })
        .in('id', plannedIds);
      if (error) throw error;
      plannedDetached = true;
    }
    if (historyIds.length) {
      const { error } = await sb.from('presentations')
        .update({ schedule_id: null })
        .in('id', historyIds);
      if (error) throw error;
      historyDetached = true;
    }
    await deleteSchedule(id);
    scheduleDeleted = true;
    schedules = await fetchSchedules();
    presentations = await reloadPresentations();
    const today = toDateStr(new Date());
    await reconcileAutomaticPresentationAssignments(today);
    refreshSchedulePageViews();
    toast('일정이 삭제되고 이후 발표 순서가 자동으로 조정되었습니다.');
  } catch(e) {
    if (!scheduleDeleted && (plannedDetached || historyDetached)) {
      const rollbackTasks = [];
      if (plannedDetached) {
        linkedRows
          .filter(row => row.status === 'planned')
          .forEach(row => {
            rollbackTasks.push(
              sb.from('presentations')
                .update({ schedule_id: id, presented_at: row.presented_at })
                .eq('id', row.id)
            );
          });
      }
      if (historyDetached) {
        rollbackTasks.push(
          sb.from('presentations')
            .update({ schedule_id: id })
            .in('id', historyIds)
        );
      }
      const rollbackResults = await Promise.allSettled(rollbackTasks);
      rollbackFailed = rollbackResults.some(result =>
        result.status === 'rejected' || result.value?.error
      );
      if (rollbackFailed) {
        console.error('일정 삭제 롤백 오류:', rollbackResults);
      }
      presentations = await reloadPresentations();
    }
    if (scheduleDeleted) {
      refreshSchedulePageViews();
      toast('일정은 삭제됐지만 이후 발표 순서를 조정하지 못했습니다. 화면을 다시 열어 주세요.');
      return;
    }
    toast(rollbackFailed
      ? '일정 삭제와 발표 연결 복구에 실패했습니다. 화면을 다시 열고 연결 상태를 확인해 주세요.'
      : '일정을 삭제하지 못했습니다. 기존 발표 연결을 복구했습니다: ' + e.message);
  }
}

// ── 상세 모달
async function showDetail(id, e) {
  if (e) e.stopPropagation();
  detailReturnFocus = document.activeElement;
  let s = schedules.find(s => s.id === id);
  // schedules에 없으면 DB에서 다시 조회
  if (!s) {
    schedules = await fetchSchedules();
    s = schedules.find(s => s.id === id);
  }
  if (!s) { console.warn('일정을 찾을 수 없음:', id); return; }

  document.getElementById('detailTitle').textContent = s.title;
  document.getElementById('detailBody').innerHTML = [
    '<div><span>날짜</span><strong>' + escapeHtml(formatScheduleDate(s.event_date)) + '</strong></div>',
    '<div><span>시간</span><strong>' + escapeHtml(s.event_time ? s.event_time.slice(0,5) : '미정') + '</strong></div>',
    '<div><span>장소</span><strong>' + escapeHtml(s.location || '미정') + '</strong></div>',
    '<div><span>구분</span><strong>' + escapeHtml(CAT_LABEL[s.category]||'기타') + '</strong></div>',
  ].join('');
  const detailMemo = extractScheduleMemo(s.description);
  const noteSection = document.getElementById('detailNoteSection');
  noteSection.hidden = !detailMemo;
  document.getElementById('detailNote').textContent = detailMemo;

  document.getElementById('detailEditBtn').onclick   = () => { closeDetail(); editSchedule(id); };
  document.getElementById('detailDeleteBtn').onclick = () => { closeDetail(); confirmDelete(id); };
  document.getElementById('detailKakaoShareBtn').onclick = (event) => shareScheduleToKakao(id, event);
  document.getElementById('detailPresentationBtn').onclick = () =>
    goToSchedulePage('schedule-order?schedule=' + encodeURIComponent(id));
  const modal = document.getElementById('detailModal');
  modal.hidden = false;
  requestAnimationFrame(() => modal.classList.add('open'));
  document.body.classList.add('sheet-open');
  setTimeout(() => modal.querySelector('.detail-close')?.focus(), 0);

  // 발표 종목 로드
  await loadPlannedItems(id, s);
}

async function loadPlannedItems(scheduleId, s) {
  const listEl  = document.getElementById('plannedList');
  const section = document.getElementById('plannedSection');
  if (!listEl) return;

  const isTalk = s.category === 'stock' || s.category === 'industry';
  if (section) section.style.display = isTalk ? 'block' : 'none';
  if (!isTalk) return;

  // 실제 발표 내용과 자동 편성된 발표자 슬롯을 함께 표시한다.
  const filteredItems = getSchedulePresentations(scheduleId, s.event_date);
  const manageButton = document.getElementById('detailPresentationBtn');
  if (manageButton) {
    manageButton.hidden = !filteredItems.length || s.event_date < toDateStr(new Date());
  }

  listEl.innerHTML = '';
  if (!filteredItems || !filteredItems.length) {
    listEl.innerHTML = '<div style="font-size:12px;color:var(--muted);padding:4px 0;">편성된 발표자가 없습니다.</div>';
    return;
  }

  filteredItems.forEach(item => {
    const topicName  = item.topic?.includes('>') ? item.topic.split('>')[1].trim() : (item.topic || '종목 미입력');
    const memberName = item.members?.name || '—';
    const isDone     = item.status === 'done';

    const row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--bg);border-radius:var(--r-md);font-size:13px;margin-bottom:4px;';

    const dot = document.createElement('span');
    dot.style.cssText = isDone
      ? 'width:8px;height:8px;border-radius:50%;background:#0f6e56;flex-shrink:0;display:inline-block;'
      : 'width:8px;height:8px;border-radius:50%;background:#b5d4f4;border:1px solid #0c447c;flex-shrink:0;display:inline-block;';

    const nameSpan = document.createElement('span');
    nameSpan.style.cssText = 'color:var(--muted);min-width:48px;font-size:12px;';
    nameSpan.textContent = memberName;

    const topicSpan = document.createElement('span');
    topicSpan.style.fontWeight = '500';
    topicSpan.style.flex = '1';
    topicSpan.textContent = topicName;

    const statusSpan = document.createElement('span');
    if (isDone) {
      statusSpan.style.cssText = 'font-size:11px;color:#0f6e56;padding:1px 6px;background:#e6f7f1;border-radius:4px;';
      statusSpan.textContent = '완료';
    } else if (item._isAutoSlot) {
      statusSpan.style.cssText = 'font-size:10px;color:#185fa5;padding:1px 6px;background:#e8f2fb;border-radius:4px;white-space:nowrap;';
      statusSpan.textContent = '자동 순서';
    } else {
      statusSpan.style.cssText = 'font-size:10px;color:var(--muted);padding:1px 6px;background:var(--surface);border:1px solid var(--border);border-radius:4px;white-space:nowrap;';
      statusSpan.textContent = '예정';
    }

    row.appendChild(dot);
    row.appendChild(nameSpan);
    row.appendChild(topicSpan);
    row.appendChild(statusSpan);
    listEl.appendChild(row);
  });
}

function closeDetail() {
  const modal = document.getElementById('detailModal');
  modal.classList.remove('open');
  modal.hidden = true;
  if (!document.getElementById('scheduleForm').classList.contains('open')) document.body.classList.remove('sheet-open');
  detailReturnFocus?.focus?.();
}
document.addEventListener('keydown', event => {
  const formModal = document.getElementById('scheduleForm');
  const detailModal = document.getElementById('detailModal');
  const openModal = formModal.classList.contains('open')
    ? formModal
    : (detailModal.classList.contains('open') ? detailModal : null);
  if (!openModal) return;

  if (event.key === 'Escape') {
    event.preventDefault();
    if (openModal === formModal) closeForm();
    else closeDetail();
    return;
  }
  if (event.key !== 'Tab') return;

  const focusable = Array.from(openModal.querySelectorAll(
    'button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
  )).filter(element => !element.hidden && element.offsetParent !== null);
  if (!focusable.length) return;
  const first = focusable[0];
  const last = focusable[focusable.length - 1];
  if (event.shiftKey && document.activeElement === first) {
    event.preventDefault();
    last.focus();
  } else if (!event.shiftKey && document.activeElement === last) {
    event.preventDefault();
    first.focus();
  }
});

init();
</script>
